# TASK-INF-013 (BE-026) — sticky-less WebSocket load balancing for Reverb.
#
# Reverb scales horizontally behind a plain round-robin: each instance
# subscribes to the REVERB_SCALING_CHANNEL Redis pub/sub channel, so an event
# published through ANY instance is delivered by EVERY instance to its own
# sockets (REVERB_SCALING_ENABLED=true on all reverb servers — see
# infra/docker-compose.yml `reverb` / `reverb-2`). WebSocket upgrades carry
# ip_hash only to keep long-lived connections stable across reloads.
#
# Include into the http{} block:
#   include /etc/nginx/conf.d/reverb-upstream.conf;

upstream reverb_nodes {
    ip_hash;                 # stable ws connection → node during reconnects
    server reverb:8080;      # docker: banana-chat-reverb-1
    server reverb-2:8080;    # docker: banana-chat-reverb-2 (profile "scale")
}

server {
    listen 8088;
    server_name _;

    location /app {
        proxy_pass http://reverb_nodes;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;   # > client heartbeat (30s)
        proxy_send_timeout 300s;
    }
}
