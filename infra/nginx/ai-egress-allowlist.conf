# TASK-INF-014 — optional egress allowlist for the AI provider (FR-AI-019).
#
# The API container must reach exactly one external host: the configured
# AI provider (e.g. api.z.ai). Everything else egress-blocked at the
# firewall/host level. When you cannot firewall, run this sidecar proxy
# inside the compose network and point the provider base_url at it:
#
#   AI_PROVIDER_HOSTS="api.z.ai api.openai.com"
#
# Usage (docker-compose, full profile):
#   ai-egress:
#     image: nginx:alpine
#     volumes:
#       - ./nginx/ai-egress-allowlist.conf:/etc/nginx/conf.d/default.conf:ro
#     environment:
#       - AI_PROVIDER_HOST=${AI_PROVIDER_HOST:-api.z.ai}
#     ports:
#       - "127.0.0.1:8788:443"   # optional, for host-side dev
#
# Then set the provider base_url to http://ai-egress/v1 (NGINX_ENVsubst
# replaces $AI_PROVIDER_HOST at container start; nginx:alpine supports it).

server {
    listen 443 ssl;
    # resolve at runtime so container DNS ordering doesn't wedge startup
    resolver 127.0.0.11 valid=30s ipv6=off;

    # only /v1/* is proxied; anything else → 403 (default)
    location /v1/ {
        proxy_pass https://$AI_PROVIDER_HOST$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name $AI_PROVIDER_HOST;
        proxy_connect_timeout 10s;
        proxy_read_timeout 660s;   # TASK-INF-014: match the ai supervisor timeout
        proxy_send_timeout 60s;
        proxy_buffering off;       # SSE streams must not buffer
        proxy_set_header Host $AI_PROVIDER_HOST;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
    }

    location / {
        return 403;
    }
}
