# TASK-INF-003 — Banana Chat production edge (see infra/nginx/Dockerfile).
#
# Serves:
#   /                    web SPA (vite dist baked into the image)
#   /assets/*            SPA fingerprinted assets (immutable)
#   /(css|js|vendor)     Filament/Laravel published static (api-public volume
#                        shared from the api image by the api-assets service)
#   /support/*           public chat visitor SPA — capability URL (FR-PCHAT-007)
#   /api/v1/public-chat/* Laravel, but never logged (the path holds a credential)
#   /api/v1/public-meetings/* same — the meeting capability code is in the path
#   /(api|admin|horizon|setup|broadcasting)   Laravel via php-fpm
#   /app/*               Reverb websocket — protocol path /app/{app_id} (DEC-044)
#   /storage/*           MinIO objects / presigned URLs

limit_req_zone $binary_remote_addr zone=edge_api:10m rate=300r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# TLS is terminated upstream (TASK-INF-004 Cloudflare or an LB) — tell
# Laravel when the original hop was https so secure cookies/URLs are right.
map $http_x_forwarded_proto $fastcgi_https {
    default '';
    https   on;
}

# Docker's embedded DNS — upstreams are resolved per request via variables
# below. Static `upstream {}` blocks resolve once at config load: a container
# recreate (new IP) would 502 until `nginx -s reload`.
resolver 127.0.0.11 valid=10s ipv6=off;

map $arg_access_token $media_authorization {
    default "Bearer $arg_access_token";
    "" $http_authorization;
}

# FR-PCHAT-007 / FR-MEET-001 (DEC-063) — CAPABILITY URLS MUST NOT REACH DISK.
# /support/<64hex>, /api/v1/public-chat/<64hex>/... and /api/v1/public-meetings/
# <64hex>/... carry a BEARER CREDENTIAL in the request PATH. Without a
# log_format nginx falls back to the image's built-in `main` (nginx.conf:17),
# which logs "$request" and "$http_referer" verbatim — i.e. the live code, into
# the container's json-file log (docker-compose.prod.yml:61-65, 3x10MB on disk).
# The credential-bearing locations below also set `access_log off`, but this
# format is the backstop for everything that does NOT match them: a fall-through
# to `location /`, a 400/414 answered before any location is chosen, a typo'd
# prefix, and the Referer header a third-party page may still send us.
# `~*` (not `~`) so a case-mangled copy of the code is redacted too.
map $request_uri $banana_safe_uri {
    default                                              $request_uri;
    "~*^(?<uri_head>.*?/)[0-9a-f]{64}(?<uri_tail>.*)$"   "${uri_head}[redacted]${uri_tail}";
}
map $http_referer $banana_safe_referer {
    default                                              $http_referer;
    ""                                                   "-";   # keep the combined-log shape for parsers
    "~*^(?<ref_head>.*?/)[0-9a-f]{64}(?<ref_tail>.*)$"   "${ref_head}[redacted]${ref_tail}";
}
log_format banana_edge '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $banana_safe_uri $server_protocol" '
                       '$status $body_bytes_sent "$banana_safe_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;
    client_max_body_size 250m;   # 200MB single-PUT uploads + headroom

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;

    # Overrides the image default `access_log ... main` for this server so no
    # 64-hex capability code can be written verbatim. Same /dev/stdout target.
    access_log /var/log/nginx/access.log banana_edge;

    # TASK-INF-042: HTTP-01 for the DNS-only TURN certificate.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # FR-MEET-001: capability links must not leak through referrers or caches.
    location /meet/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
        add_header Cache-Control no-store always;
        access_log off;
        try_files /index.html =404;
    }

    # FR-PCHAT-007 (DEC-063) — the visitor SPA. `/support/<64hex>` IS the
    # visitor's only credential, so this page gets exactly the /meet/ treatment:
    # no referrer (the full URL must not ride the Referer header to any
    # same-origin subresource — the inherited strict-origin-when-cross-origin
    # from the server block would send it), no store, no access log.
    # `^~` so no regex location added later can ever steal a credential path.
    # try_files /index.html: the React route is client-side (App.tsx:62), same
    # history fallback /meet/ uses — $uri is never tried, so a request for
    # /support/<code>/anything cannot be answered off the filesystem.
    # error_log: same reasoning as /api/v1/public-chat/ and /rtc — `access_log
    # off` silences only the access log. An error-level line (an open() failure,
    # or a 414 on a long request line) still writes `request: "GET /support/
    # <code>"` verbatim to stderr and from there to the container's json-file
    # log, which is exactly the credential this block exists to keep off disk.
    # Cost: try_files failures for this prefix are silent.
    location ^~ /support/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
        add_header Cache-Control no-store always;
        access_log off;
        error_log /dev/null;
        try_files /index.html =404;
    }

    # FR-NOTI-003 / DEC-077 — the PWA manifest. nginx's mime.types has no entry for
    # .webmanifest, so it fell back to application/octet-stream. Chrome tolerates
    # that; iOS Safari is stricter, and installability to the Home Screen is the
    # precondition for web push on iPhone, so the type has to be right.
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The service worker must never be cached beyond a revalidation, or a deployed
    # fix to it is pinned until the browser's own 24h SW refresh. `=404` matters as
    # much: without it a missing file falls through to the SPA fallback below and is
    # served as 200 text/html, which registers as a worker that does nothing and
    # gets cached by Cloudflare (the livewire.min.js incident, 2026-09-10).
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    # ---- web SPA: immutable fingerprinted assets + history fallback
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # SPA html must revalidate: a misrouted .js-looking URL once fell through
    # to this fallback and Cloudflare cached the 200 text/html copy, which
    # then kept serving to browsers after the route was fixed (found on prod
    # 2026-09-10: livewire.min.js → text/html from CF edge, origin clean).
    # add_header at location level drops the server-block headers — repeat them.
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # ---- Filament/Laravel published static (regex beats the SPA prefix
    #      locations; vite output lives under /assets so nothing collides)
    location ~* ^/(css|js|vendor|favicon\.ico|robots\.txt)(/|$) {
        root /var/www/api-public;
        access_log off;
        expires 30d;
        try_files $uri =404;
    }

    # FR-PCHAT-007/016 (DEC-063) — Tier-2 visitor API. Identical fpm handling to
    # the general api location below (kept in sync by hand: limit_req, fastcgi
    # params, no buffering, 300s read) — it only differs in what it writes down.
    # `^~` is REQUIRED: a plain prefix loses to the `~ ^/(api|...)` regex below.
    # WHY: every visitor request — and the page polls ?after_seq= every 5s as an
    # Echo fallback — carries the 64-hex code in the path, so `combined`/`main`
    # would stream the live credential to disk continuously.
    # error_log: same reasoning as /rtc — limit_req_log_level defaults to
    # `error` and every limit/upstream line carries `request: "GET /api/v1/
    # public-chat/<code>/..."`, so the credential leaks through stderr too.
    # Cost: 502/504 and rate-limit diagnostics for this prefix are silent.
    # add_header: defining ANY here drops the server-block set (see the note
    # above location /), so all four are repeated — with Referrer-Policy
    # overridden to no-referrer. nginx APPENDS after the fpm response, and the
    # Referrer Policy spec takes the LAST valid token, so the inherited
    # strict-origin-when-cross-origin would otherwise silently defeat the
    # no-referrer the Tier-2 JSON responses set for themselves.
    # Cache-Control is deliberately NOT repeated: the app already sends
    # no-store on this tier and a second header would only be noise.
    # NOTE: this prefix also covers the authenticated Tier-3 agent routes
    # (/api/v1/public-chat/rooms|summary, routes/api.php:223-235). They carry no
    # credential; they just lose edge access logging. See the report.
    location ^~ /api/v1/public-chat/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
        access_log off;
        error_log /dev/null;
        limit_req zone=edge_api burst=150 nodelay;
        include fastcgi_params;
        set $pchat_fpm api:9000;
        fastcgi_pass $pchat_fpm;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_buffering off;    # streaming/SSE-safe (FR-AI-004)
        fastcgi_read_timeout 300s;
    }

    # FR-MEET-001 (DEC-063's reasoning, applied to a SHIPPED feature) — the
    # public meeting capability code leaks through the ERROR log.
    # /api/v1/public-meetings/<64hex>{,/join,/leave} (routes/api.php:91-93)
    # carries a bearer credential in the request PATH. The ACCESS line is
    # already redacted by the banana_edge log_format above; the ERROR line is
    # NOT — limit_req_log_level defaults to `error`, and every limit, upstream
    # and 414 line writes `request: "POST /api/v1/public-meetings/<code>/join"`
    # verbatim to stderr and from there into the container's json-file log.
    # This prefix had no location of its own and fell through to the
    # `~ ^/(api|...)` regex below, so the fix is a block rather than an edit —
    # and `^~` is REQUIRED for it to win against that regex.
    # access_log deliberately stays ON: banana_edge already strips the code, and
    # a shipped feature keeps its 4xx/5xx diagnostics when they cost nothing.
    # No add_header here on purpose — defining ANY drops the whole server-block
    # set (see the note above location /) and this tier needs none of its own.
    # fpm handling duplicated from the public-chat block by necessity; keep the
    # three in sync by hand (limit_req, fastcgi params, no buffering, 300s).
    location ^~ /api/v1/public-meetings/ {
        error_log /dev/null;
        limit_req zone=edge_api burst=150 nodelay;
        include fastcgi_params;
        set $meet_fpm api:9000;
        fastcgi_pass $meet_fpm;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_buffering off;    # streaming/SSE-safe (FR-AI-004)
        fastcgi_read_timeout 300s;
    }

    # ---- Laravel app via fpm (livewire: Filament's JS/assets route — found
    #      via Playwright on prod: without it livewire.min.js fell through to
    #      the SPA fallback and the admin panel died with a MIME error)
    location ~ ^/(api|admin|horizon|setup|broadcasting|livewire)(/|$) {
        # Coarse per-IP brake matching the app-level pacing (300 req/min);
        # finer per-user/per-route limits live in the app itself.
        limit_req zone=edge_api burst=150 nodelay;
        include fastcgi_params;
        set $banana_fpm api:9000;
        fastcgi_pass $banana_fpm;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_buffering off;    # streaming/SSE-safe (FR-AI-004)
        fastcgi_read_timeout 300s;
    }

    # FR-CALL-004: all signaling admissions use current app membership/session state.
    location = /_call_auth {
        internal;
        include fastcgi_params;
        set $call_fpm api:9000;
        fastcgi_pass $call_fpm;
        fastcgi_pass_request_body off;
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_param REQUEST_URI /api/v1/calls/authorize-media;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param HTTP_AUTHORIZATION $call_authorization;
    }
    location /rtc {
        limit_req zone=edge_api burst=150 nodelay;
        error_log /dev/null; # nginx errors can otherwise include bearer tokens in the request URI.
        access_log off; # access_token is a bearer credential in the websocket query.
        set $call_authorization $media_authorization;
        auth_request /_call_auth;
        set $call_sfu livekit:7880;
        proxy_pass http://$call_sfu;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Reverb websocket (TASK-INF-003: upgrade + 75s timeouts)
    location /app/ {
        set $banana_reverb reverb:8080;
        proxy_pass http://$banana_reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
    }

    # ---- MinIO objects, SIGNED-path-safe (DEC-046). Two facts drive this:
    #      1. `proxy_pass http://$var/` with a URI part + variable forwards
    #         the URI literally ("/") — every request hit MinIO as "/". The
    #         rewrite+break pattern is the correct variable-upstream strip.
    #      2. SigV4 signs the endpoint's PATH too: an endpoint of
    #         https://host/storage makes the SDK sign /storage/orgchat/key,
    #         which MinIO (receiving /orgchat/key) rejects. So presigned
    #         setups must use the HOST ROOT as endpoint and let the bucket
    #         live in the URL path — location /orgchat/ below forwards the
    #         URI verbatim: what was signed is exactly what MinIO sees.
    #      Host passes through untouched for the same reason (signatures
    #      cover Host).
    location /orgchat/ {
        set $banana_minio minio:9000;
        proxy_pass http://$banana_minio;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        client_max_body_size 250m;
    }

    # ---- /storage/ keeps serving the classic public-file prefix (unsigned
    #      reads of public objects). NOT suitable for signed/presigned S3 —
    #      use the bucket path above for that.
    location /storage/ {
        set $banana_minio minio:9000;
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass http://$banana_minio;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
    }
}
