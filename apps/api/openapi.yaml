openapi: 3.1.0
info:
  title: Banana Chat (orgchat) API
  version: 1.1.1
  description: >
    PH1 surface of the self-hosted workspace chat API. All responses follow the
    §7 envelope: success `{data, meta?}`, error `{error:{code,message,details?,request_id}}`.
    Workspace-scoped endpoints require the `X-Workspace-Id` header (workspace slug).
servers:
  - url: http://localhost:8000/api/v1
    description: Local dev (D1 hybrid topology)

components:
  securitySchemes:
    mediaAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: LiveKit media token issued by API-152 or API-163; not an API access token.
    bearerAuth:
      type: http
      scheme: bearer
      description: access_token from /auth/login (60 min TTL)
    pchatHmac:
      type: apiKey
      in: header
      name: X-PChat-Key
      description: >
        FR-PCHAT-031 partner credential. The public key id (`pck_` + 28 hex) travels in this header and
        MUST be accompanied by X-PChat-Timestamp, X-PChat-Nonce and X-PChat-Signature, declared as
        required parameters on every partner operation. The signature is `v1=` + lowercase hex
        HMAC-SHA256 over exactly six "\n"-joined lines — `v1`, uppercase method, request path including
        /api/v1 and without query string, timestamp, nonce, and sha256 of the RAW request body bytes
        (sha256 of the empty string when there is no body). Sign the exact bytes put on the wire; never
        re-serialised JSON. Sign server-side only — never from browser JavaScript. Never a user session.
  parameters:
    workspaceSlug:
      name: X-Workspace-Id
      in: header
      required: true
      schema: { type: string }
      description: slug of the active workspace
    pchatCode:
      name: code
      in: path
      required: true
      schema: {type: string, pattern: '^[a-f0-9]{64}$'}
      description: >
        The visitor capability code (FR-PCHAT / DEC-063). Possession of it IS the identity. It must never
        appear in a query string, a channel name, a referrer header or an access log; the edge sets
        no-referrer, no-store and access_log off on both /support/ and /api/v1/public-chat/.
    pchatTimestamp:
      name: X-PChat-Timestamp
      in: header
      required: true
      schema: {type: integer}
      description: Unix seconds. Accepted within +/-300s of server time, else 401 API_TIMESTAMP_SKEW.
    pchatNonce:
      name: X-PChat-Nonce
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$'}
      description: Single use per key. Cached for 600s (more than twice the skew window), else 409 API_NONCE_REPLAYED.
    pchatSignature:
      name: X-PChat-Signature
      in: header
      required: true
      schema: {type: string, pattern: '^v1=[a-f0-9]{64}$'}
      description: See the pchatHmac security scheme for the canonical string. Compared in constant time.
  schemas:
    PublicMeeting:
      type: object
      required: [id, code, title, expires_at, ended_at, created_at]
      properties:
        id: {type: string}
        code: {type: string, pattern: '^[a-f0-9]{64}$'}
        title: {type: string, maxLength: 120}
        expires_at: {type: string, format: date-time}
        ended_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    MeetingJoin:
      type: object
      required: [meeting, participant_id, participant_token, url, token, can_end, workspace_slug]
      properties:
        meeting: {$ref: '#/components/schemas/PublicMeeting'}
        participant_id: {type: string}
        participant_token: {type: string, description: Private browser participant capability; never an API account token.}
        url: {type: string}
        token: {type: string}
        can_end: {type: boolean}
        workspace_slug: {type: [string, 'null'], description: Only returned to the meeting creator.}
    PublicChatRoomPartner:
      type: object
      description: API-201 partner view. Status counts and the external display name only; never message bodies.
      required: [id, status, customer_name, provider_name, message_count, expires_at]
      properties:
        id: {type: string, description: 'Room ULID. Partner routes address rooms by this, never by code.'}
        status: {type: string, enum: [new, in_progress, done, problem]}
        customer_name: {type: string, maxLength: 120}
        provider_name: {type: string, maxLength: 120}
        assigned_display_name: {type: [string, 'null'], description: 'External display name of the assigned agent, or null.'}
        message_count: {type: integer}
        last_message_at: {type: [string, 'null'], format: date-time}
        closed_at: {type: [string, 'null'], format: date-time}
        expires_at: {type: string, format: date-time}
    PublicChatRoomVisitor:
      type: object
      description: >
        API-210 visitor view. Deliberately carries status_public, never the raw status - a customer must
        not learn that support flagged the conversation `problem` (FR-PCHAT-007).
      required: [code, customer_name, provider_name, status_public, locale, created_at]
      properties:
        code: {type: string, pattern: '^[a-f0-9]{64}$'}
        customer_name: {type: string, maxLength: 120}
        provider_name: {type: string, maxLength: 120}
        status_public: {type: string, enum: [open, closed], description: 'open = new|in_progress|problem, closed = done'}
        locale: {type: string, enum: [th, en]}
        created_at: {type: string, format: date-time}
    PublicChatMessageVisitor:
      type: object
      description: >
        Public payload. Contains no user ULID, no mentions, no read receipts, no assignee and no room meta;
        an agent is identified only by external_display_name (`provider name (admin username)`) built from
        write-time snapshots (FR-PCHAT-014).
      required: [id, seq, sender_kind, type, created_at]
      properties:
        id: {type: string}
        seq: {type: integer}
        sender_kind: {type: string, enum: [visitor, agent, system]}
        external_display_name: {type: [string, 'null'], description: 'Plain text `provider name (admin username)`; never HTML, never Markdown.'}
        type: {type: string, enum: [text, image, video, file, system]}
        body: {type: [string, 'null']}
        system_event: {type: [string, 'null'], enum: [claimed, reassigned, status_changed, closed_by_customer, link_rotated, null]}
        reply_to:
          type: [object, 'null']
          description: Snippet-only quote. Deliberately carries no sender id.
          properties:
            seq: {type: integer}
            snippet: {type: string}
            deleted: {type: boolean}
        attachments: {type: array, items: {type: object}, description: Whitelisted attachment fields only; never delegated to the internal serializer.}
        deleted_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    PublicChatRoomStaff:
      type: object
      description: API-220/221 agent view. Carries the raw status, the assignee, meta and external_ref.
      required: [id, workspace_id, status, customer_name, provider_name, created_at, expires_at]
      properties:
        id: {type: string}
        workspace_id: {type: string}
        status: {type: string, enum: [new, in_progress, done, problem]}
        customer_name: {type: string}
        provider_name: {type: string}
        external_ref: {type: [string, 'null']}
        meta: {type: [object, 'null'], description: Customer-supplied payload. Never serialised to the visitor.}
        locale: {type: string, enum: [th, en]}
        assigned_to: {type: [object, 'null'], properties: {id: {type: string}, username: {type: string}, display_name: {type: string}}}
        claimed_at: {type: [string, 'null'], format: date-time}
        first_response_at: {type: [string, 'null'], format: date-time}
        last_seq: {type: integer}
        last_visitor_seq: {type: integer}
        last_agent_seq: {type: integer}
        needs_reply: {type: boolean, description: last_visitor_seq > last_agent_seq and status != done}
        my_last_read_seq: {type: integer}
        unread_count: {type: integer}
        last_message_at: {type: [string, 'null'], format: date-time}
        closed_at: {type: [string, 'null'], format: date-time}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    PublicChatMessageStaff:
      type: object
      description: Internal payload, broadcast only on private-public-chat-staff.{room_id}.
      required: [id, room_id, seq, sender_kind, type, created_at]
      properties:
        id: {type: string}
        room_id: {type: string}
        seq: {type: integer}
        sender_kind: {type: string, enum: [visitor, agent, system]}
        sender: {type: [object, 'null'], properties: {id: {type: string}, username: {type: string}, display_name: {type: string}}}
        external_display_name: {type: [string, 'null']}
        type: {type: string, enum: [text, image, video, file, system]}
        body: {type: [string, 'null']}
        system_event: {type: [string, 'null']}
        system_meta: {type: [object, 'null']}
        reply_to_message_id: {type: [string, 'null']}
        client_message_id: {type: string}
        attachments: {type: array, items: {type: object}}
        deleted_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    RoomCall:
      type: object
      required: [id,room_id,workspace_id,kind,started_by,caller_name,room_type,participants,created_at]
      properties:
        id: {type: string}
        room_id: {type: string}
        workspace_id: {type: string}
        kind: {type: string, enum: [voice,video]}
        started_by: {type: string}
        caller_name: {type: string}
        room_name: {type: [string, 'null']}
        room_type: {type: string, enum: [dm,group]}
        participants: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
        connected_at: {type: [string, 'null'], format: date-time}
        ended_at: {type: [string, 'null'], format: date-time}
    CallJoin:
      type: object
      required: [call,token,url]
      properties:
        call: {$ref: '#/components/schemas/RoomCall'}
        token: {type: string, description: 'Short-lived media JWT; never persist or log.'}
        url: {type: string, format: uri}
    KanbanLaneInput:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 60}
        color: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        position: {type: integer, minimum: 0, maximum: 100}
        is_done: {type: boolean}
    KanbanTicketInput:
      description: FR-KAN-006; ticket responses include ordered attachments using the standard Attachment shape. Omitted attachment_ids preserves existing images; empty array removes all.
      type: object
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: [string, 'null'], maxLength: 20000}
        lane_id: {type: string}
        type: {type: string, enum: [task,bug,story]}
        priority: {type: string, enum: [low,medium,high,urgent]}
        assignee_id: {type: [string, 'null']}
        due_at: {type: [string, 'null'], format: date-time}
        labels: {type: array, maxItems: 10, items: {type: string, maxLength: 30}}
        attachment_ids: {type: array, maxItems: 20, uniqueItems: true, items: {type: string}, description: "New IDs must be completed image uploads owned by the actor in this workspace and not already linked."}
        version: {type: integer, minimum: 1}
    UploadTicket:
      description: API-060 / FR-MEDIA-001; multipart is returned for S3 uploads above the configured threshold.
      type: object
      required: [attachment_id, put_url, headers, expires_at]
      properties:
        attachment_id: { type: string }
        put_url: { type: [string, 'null'] }
        headers: { type: object, additionalProperties: { type: string } }
        expires_at: { type: string, format: date-time }
        multipart:
          type: [object, 'null']
          required: [upload_id, part_size, part_urls]
          properties:
            upload_id: { type: string }
            part_size: { type: integer, minimum: 1 }
            part_urls: { type: array, items: { type: string } }
    CompleteUpload:
      description: API-061; omit the body for single PUT, provide ordered S3 ETags for multipart.
      type: object
      properties:
        parts:
          type: array
          items:
            type: object
            required: [part_number, etag]
            properties:
              part_number: { type: integer, minimum: 1 }
              etag: { type: string }
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string, example: MSG_TOO_LONG }
            message: { type: string }
            details:
              type: object
              description: e.g. VALIDATION_FAILED carries details.fields
            request_id: { type: [string, 'null'] }
    UserStub:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        avatar_attachment_id: { type: [string, 'null'] }
    WorkspaceSummary:
      type: object
      properties:
        workspace:
          type: object
          properties:
            id: { type: string }
            slug: { type: string }
            name: { type: string }
            status: { type: string, enum: [active, archived] }
        role: { type: string, enum: [owner, admin, member] }
        unread_rooms_count: { type: integer }
        total_unread: { type: integer }
    RoomListItem:
      type: object
      properties:
        room:
          type: object
          properties:
            id: { type: string }
            workspace_id: { type: string }
            type: { type: string, enum: [dm, group, channel] }
            name: { type: [string, 'null'] }
            description: { type: [string, 'null'] }
            last_seq: { type: integer }
            member_count: { type: integer }
            last_message_at: { type: [string, 'null'] }
            is_secret:
              type: boolean
              description: FR-ROOM-012 — secret (auto-expiring) room
            secret_expires_at:
              type: [string, 'null']
              format: date-time
              description: expiry instant; every room-scoped access returns 410 ROOM_EXPIRED from this moment
        my_role: { type: string, enum: [owner, admin, member] }
        other_user: { $ref: '#/components/schemas/UserStub' }
        last_message:
          type: [object, 'null']
          description: stub of the newest message
        unread_count: { type: integer }
        muted: { type: boolean }
    Message:
      type: object
      properties:
        id: { type: string }
        room_id: { type: string }
        workspace_id: { type: string }
        sender_id: { type: string }
        sender: { $ref: '#/components/schemas/UserStub' }
        type: { type: string, enum: [text, system, media, file] }
        body: { type: [string, 'null'] }
        seq: { type: integer }
        client_message_id: { type: [string, 'null'] }
        reply_to: { type: [object, 'null'] }
        system_event: { type: [object, 'null'] }
        edited_at: { type: [string, 'null'] }
        edit_count: { type: integer }
        deleted_at: { type: [string, 'null'] }
        delete_reason: { type: [string, 'null'] }
        created_at: { type: string }
        attachments:
          type: array
          items: { type: object }

security:
  - bearerAuth: []

paths:
  /meetings:
    parameters:
      - {$ref: '#/components/parameters/workspaceSlug'}
    get:
      summary: API-160 — List own meeting links in the workspace (latest 100)
      responses:
        '200':
          description: Creator-owned links
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/PublicMeeting'}}
    post:
      summary: API-160 — Create a public video meeting link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: {type: string, minLength: 1, maxLength: 120}
                expires_in_hours: {type: integer, minimum: 1, maximum: 168, default: 168}
      responses:
        '201':
          description: Meeting created
          content:
            application/json:
              schema: {type: object, properties: {data: {$ref: '#/components/schemas/PublicMeeting'}}}
        '429': {description: Create rate limit exceeded}
  /meetings/{id}/end:
    post:
      summary: API-161 — Creator ends a meeting and permanently revokes its link
      parameters:
        - {$ref: '#/components/parameters/workspaceSlug'}
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Ended}
        '404': {description: Not found or not creator in this workspace}
  /public-meetings/{code}:
    get:
      summary: API-162 — Public lobby and optional verified account identity
      security: [{}, {bearerAuth: []}]
      parameters:
        - {name: code, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{64}$'}}
      responses:
        '200':
          description: No workspace or chat content; supplied bearer credentials must be valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      title: {type: string}
                      expires_at: {type: string, format: date-time}
                      capacity: {type: integer}
                      identity:
                        type: [object, 'null']
                        properties:
                          name: {type: string}
                          member: {type: boolean, const: true}
        '410': {description: 'Expired, ended or creator/workspace unavailable'}
        '401': {description: Supplied account credentials invalid}
        '403': {description: Account suspended or password change required}
        '404': {description: Unknown link}
  /public-meetings/{code}/join:
    post:
      summary: API-163 — Join as verified member or named guest
      security: [{}, {bearerAuth: []}]
      parameters:
        - {name: code, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{64}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 80, description: Required for a new anonymous participant; ignored for members.}
                participant_token: {type: string, minLength: 64, maxLength: 64, description: Optional private rejoin capability. Rotated on successful join.}
      responses:
        '200':
          description: Meeting-specific media credentials; never grants workspace membership
          content:
            application/json:
              schema: {type: object, properties: {data: {$ref: '#/components/schemas/MeetingJoin'}}}
        '409': {description: Full or member active on another session}
        '410': {description: Link unavailable}
        '422': {description: Missing or invalid guest name}
        '429': {description: Join rate limit exceeded}
  /public-meetings/{code}/leave:
    post:
      summary: API-164 — Leave using a private participant capability
      security: []
      parameters:
        - {name: code, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{64}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participant_token]
              properties:
                participant_token: {type: string}
      responses:
        '204': {description: Participant revoked}
        '403': {description: Wrong participant capability}
  /calls:
    get:
      summary: API-150 — List active room calls
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/workspaceSlug"}
      responses:
        '200':
          description: Success
        '401':
          description: Invalid or expired authentication
        '403':
          description: Access denied
        '404':
          description: Room or call is not accessible
        '409':
          description: Call ended or at capacity
        '503':
          description: Calling is disabled or unavailable
  /rooms/{id}/calls:
    post:
      summary: API-151 — Start video or dm voice call
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/workspaceSlug"}
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: {type: string, enum: [voice, video]}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/RoomCall'}
        '401':
          description: Invalid or expired authentication
        '403':
          description: Access denied
        '404':
          description: Room or call is not accessible
        '409':
          description: Call ended or at capacity
        '503':
          description: Calling is disabled or unavailable
  /calls/{id}/join:
    post:
      summary: API-152 — Issue session-bound media credentials
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/workspaceSlug"}
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/CallJoin'}
        '401':
          description: Invalid or expired authentication
        '403':
          description: Access denied
        '404':
          description: Room or call is not accessible
        '409':
          description: Call ended or at capacity
        '503':
          description: Calling is disabled or unavailable
  /calls/{id}/leave:
    post:
      summary: API-153 — Leave call
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/workspaceSlug"}
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '204':
          description: Success
        '401':
          description: Invalid or expired authentication
        '403':
          description: Access denied
        '404':
          description: Room or call is not accessible
        '409':
          description: Call ended or at capacity
        '503':
          description: Calling is disabled or unavailable
  /calls/{id}/end:
    post:
      summary: API-154 — Starter ends call for everyone
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/workspaceSlug"}
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '204':
          description: Success
        '401':
          description: Invalid or expired authentication
        '403':
          description: Access denied
        '404':
          description: Room or call is not accessible
        '409':
          description: Call ended or at capacity
        '503':
          description: Calling is disabled or unavailable
  /calls/{id}/decline:
    post:
      summary: API-155 — Decline invitation
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/workspaceSlug"}
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '204':
          description: Success
        '401':
          description: Invalid or expired authentication
        '403':
          description: Access denied
        '404':
          description: Room or call is not accessible
        '409':
          description: Call ended or at capacity
        '503':
          description: Calling is disabled or unavailable
  /calls/authorize-media:
    get:
      summary: API-156 — Authorize media signaling with LiveKit JWT
      security: [{mediaAuth: []}]
      responses:
        '204':
          description: Success
        '401':
          description: Invalid or expired authentication
        '403':
          description: Access denied
        '404':
          description: Room or call is not accessible
        '409':
          description: Call ended or at capacity
        '503':
          description: Calling is disabled or unavailable
  /uploads:
    post:
      summary: API-060 Create upload ticket (single PUT or multipart)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/workspaceSlug' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, filename, mime_type, size_bytes]
              properties:
                kind: { type: string, enum: [image, video, file, avatar] }
                filename: { type: string }
                mime_type: { type: string }
                size_bytes: { type: integer, minimum: 1 }
                sha256: { type: string }
      responses:
        '201':
          description: Upload ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UploadTicket' }
  /uploads/{id}/complete:
    post:
      summary: API-061 Verify upload and complete multipart when applicable
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/workspaceSlug' }
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteUpload' }
      responses:
        '200':
          description: Attachment accepted for processing; returns data.attachment
  /auth/login:
    post:
      summary: API-001 login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                device:
                  type: object
                  properties:
                    platform: { type: string }
                    name: { type: string }
                    app_version: { type: string }
      responses:
        '200':
          description: tokens + user + workspaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  expires_in: { type: integer }
                  refresh_token: { type: string }
                  user: { $ref: '#/components/schemas/UserStub' }
                  workspaces:
                    type: array
                    items: { $ref: '#/components/schemas/WorkspaceSummary' }
                  must_change_password: { type: boolean }
        '401': { description: 'invalid credentials, schema: { $ref: ''#/components/schemas/Error'' } '}
        '423': { description: 'locked (AUTH_LOCKED), schema: { $ref: ''#/components/schemas/Error'' } '}
        '429': { description: 'rate limited, schema: { $ref: ''#/components/schemas/Error'' } '}
  /auth/refresh:
    post:
      summary: API-002 rotate refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200': {description: 'rotated tokens'}
        '401': {description: 'reuse detected → session revoked'}
  /auth/logout:
    post: { summary: API-003 logout current session, responses: { '204': {description: 'no content'} } }
  /auth/logout-all:
    post: { summary: API-004 revoke every session, responses: { '204': {description: 'no content'} } }
  /auth/change-password:
    post:
      summary: API-005 change password (revokes other sessions)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string }
      responses:
        '204': {description: 'changed'}
        '422': { description: 'policy violation, schema: { $ref: ''#/components/schemas/Error'' } '}
  /me:
    get: { summary: API-008 profile + settings, responses: { '200': {description: 'ok'} } }
