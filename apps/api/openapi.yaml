openapi: 3.1.0
info:
  title: Banana Chat (orgchat) API
  version: 1.1.1
  description: >
    PH1 surface of the self-hosted workspace chat API. All responses follow the
    §7 envelope: success `{data, meta?}`, error `{error:{code,message,details?,request_id}}`.
    Workspace-scoped endpoints require the `X-Workspace-Id` header (workspace slug).
servers:
  - url: http://localhost:8000/api/v1
    description: Local dev (D1 hybrid topology)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: access_token from /auth/login (60 min TTL)
  parameters:
    workspaceSlug:
      name: X-Workspace-Id
      in: header
      required: true
      schema: { type: string }
      description: slug of the active workspace
  schemas:
    UploadTicket:
      description: API-060 / FR-MEDIA-001; multipart is returned for S3 uploads above the configured threshold.
      type: object
      required: [attachment_id, put_url, headers, expires_at]
      properties:
        attachment_id: { type: string }
        put_url: { type: [string, 'null'] }
        headers: { type: object, additionalProperties: { type: string } }
        expires_at: { type: string, format: date-time }
        multipart:
          type: [object, 'null']
          required: [upload_id, part_size, part_urls]
          properties:
            upload_id: { type: string }
            part_size: { type: integer, minimum: 1 }
            part_urls: { type: array, items: { type: string } }
    CompleteUpload:
      description: API-061; omit the body for single PUT, provide ordered S3 ETags for multipart.
      type: object
      properties:
        parts:
          type: array
          items:
            type: object
            required: [part_number, etag]
            properties:
              part_number: { type: integer, minimum: 1 }
              etag: { type: string }
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string, example: MSG_TOO_LONG }
            message: { type: string }
            details:
              type: object
              description: e.g. VALIDATION_FAILED carries details.fields
            request_id: { type: [string, 'null'] }
    UserStub:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        avatar_attachment_id: { type: [string, 'null'] }
    WorkspaceSummary:
      type: object
      properties:
        workspace:
          type: object
          properties:
            id: { type: string }
            slug: { type: string }
            name: { type: string }
            status: { type: string, enum: [active, archived] }
        role: { type: string, enum: [owner, admin, member] }
        unread_rooms_count: { type: integer }
        total_unread: { type: integer }
    RoomListItem:
      type: object
      properties:
        room:
          type: object
          properties:
            id: { type: string }
            workspace_id: { type: string }
            type: { type: string, enum: [dm, group, channel] }
            name: { type: [string, 'null'] }
            description: { type: [string, 'null'] }
            last_seq: { type: integer }
            member_count: { type: integer }
            last_message_at: { type: [string, 'null'] }
        my_role: { type: string, enum: [owner, admin, member] }
        other_user: { $ref: '#/components/schemas/UserStub' }
        last_message:
          type: [object, 'null']
          description: stub of the newest message
        unread_count: { type: integer }
        muted: { type: boolean }
    Message:
      type: object
      properties:
        id: { type: string }
        room_id: { type: string }
        workspace_id: { type: string }
        sender_id: { type: string }
        sender: { $ref: '#/components/schemas/UserStub' }
        type: { type: string, enum: [text, system, media, file] }
        body: { type: [string, 'null'] }
        seq: { type: integer }
        client_message_id: { type: [string, 'null'] }
        reply_to: { type: [object, 'null'] }
        system_event: { type: [object, 'null'] }
        edited_at: { type: [string, 'null'] }
        edit_count: { type: integer }
        deleted_at: { type: [string, 'null'] }
        delete_reason: { type: [string, 'null'] }
        created_at: { type: string }
        attachments:
          type: array
          items: { type: object }

security:
  - bearerAuth: []

paths:
  /uploads:
    post:
      summary: API-060 Create upload ticket (single PUT or multipart)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/workspaceSlug' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, filename, mime_type, size_bytes]
              properties:
                kind: { type: string, enum: [image, video, file, avatar] }
                filename: { type: string }
                mime_type: { type: string }
                size_bytes: { type: integer, minimum: 1 }
                sha256: { type: string }
      responses:
        '201':
          description: Upload ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UploadTicket' }
  /uploads/{id}/complete:
    post:
      summary: API-061 Verify upload and complete multipart when applicable
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/workspaceSlug' }
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteUpload' }
      responses:
        '200':
          description: Attachment accepted for processing; returns data.attachment
  /auth/login:
    post:
      summary: API-001 login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                device:
                  type: object
                  properties:
                    platform: { type: string }
                    name: { type: string }
                    app_version: { type: string }
      responses:
        '200':
          description: tokens + user + workspaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  expires_in: { type: integer }
                  refresh_token: { type: string }
                  user: { $ref: '#/components/schemas/UserStub' }
                  workspaces:
                    type: array
                    items: { $ref: '#/components/schemas/WorkspaceSummary' }
                  must_change_password: { type: boolean }
        '401': { description: invalid credentials, schema: { $ref: '#/components/schemas/Error' } }
        '423': { description: locked (AUTH_LOCKED), schema: { $ref: '#/components/schemas/Error' } }
        '429': { description: rate limited, schema: { $ref: '#/components/schemas/Error' } }
  /auth/refresh:
    post:
      summary: API-002 rotate refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200': { description: rotated tokens }
        '401': { description: reuse detected → session revoked }
  /auth/logout:
    post: { summary: API-003 logout current session, responses: { '204': { description: no content } } }
  /auth/logout-all:
    post: { summary: API-004 revoke every session, responses: { '204': { description: no content } } }
  /auth/change-password:
    post:
      summary: API-005 change password (revokes other sessions)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string }
      responses:
        '204': { description: changed }
        '422': { description: policy violation, schema: { $ref: '#/components/schemas/Error' } }
  /me:
    get: { summary: API-008 profile + settings, responses: { '200': { description: ok } } }
    patch: { summary: API-009 update profile, responses: { '200': { description: updated } } }
  /me/workspaces:
    get:
      summary: API-010 workspaces the user belongs to
      responses:
        '200':
          description: list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkspaceSummary' }
  /me/sessions:
    get: { summary: API-006 active sessions, responses: { '200': { description: list } } }
  /me/sessions/{sessionId}:
    delete:
      summary: API-007 revoke another session
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: revoked }
  /workspace:
    get:
      summary: API-012 current workspace detail (X-Workspace-Id)
      parameters: [{ $ref: '#/components/parameters/workspaceSlug' }]
      responses: { '200': { description: ok }, '403': { description: WS_FORBIDDEN / WS_ARCHIVED } }
  /members:
    get:
      summary: API-011 workspace directory
      parameters:
        - { $ref: '#/components/parameters/workspaceSlug' }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserStub' }
  /sync:
    get:
      summary: API-013 delta sync
      parameters:
        - { $ref: '#/components/parameters/workspaceSlug' }
        - { name: since, in: query, schema: { type: string, format: date-time } }
      responses: { '200': { description: changed rooms } }
  /rooms:
    get:
      summary: API-020 room list
      parameters:
        - { $ref: '#/components/parameters/workspaceSlug' }
        - { name: filter, in: query, schema: { type: string, enum: [all, unread, hidden] } }
      responses:
        '200':
          description: rooms
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoomListItem' }
    post:
      summary: API-021 create dm or group
      parameters: [{ $ref: '#/components/parameters/workspaceSlug' }]
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [type, user_id]
                  properties:
                    type: { type: string, enum: [dm] }
                    user_id: { type: string }
                - type: object
                  required: [type, name, member_ids]
                  properties:
                    type: { type: string, enum: [group] }
                    name: { type: string }
                    member_ids: { type: array, items: { type: string } }
                    description: { type: string }
      responses:
        '201': { description: created }
        '422': { description: ROOM_DM_SELF / ROOM_FULL / VALIDATION_FAILED }
  /rooms/{roomId}:
    parameters:
      - { name: roomId, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/workspaceSlug' }
    get: { summary: API-022 room detail, responses: { '200': { description: ok }, '404': { description: not found } } }
    patch: { summary: API-023 update group info, responses: { '200': { description: updated } } }
    delete: { summary: API-024 soft delete + purge_after, responses: { '204': { description: deleted } } }
  /rooms/{roomId}/members:
    parameters:
      - { name: roomId, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/workspaceSlug' }
    get: { summary: API-025 members, responses: { '200': { description: list } } }
    post:
      summary: API-026 add members
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids: { type: array, items: { type: string } }
      responses: { '201': { description: added } }
  /rooms/{roomId}/members/{userId}:
    parameters:
      - { name: roomId, in: path, required: true, schema: { type: string } }
      - { name: userId, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/workspaceSlug' }
    delete: { summary: API-027 remove member, responses: { '204': { description: removed } } }
    patch: { summary: API-028 change role, responses: { '200': { description: updated } } }
  /rooms/{roomId}/leave:
    post:
      summary: API-029 leave room
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/workspaceSlug' }
      responses: { '204': { description: left } }
  /rooms/{roomId}/messages:
    parameters:
      - { name: roomId, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/workspaceSlug' }
    get:
      summary: API-040 message page (keyset pagination)
      parameters:
        - { name: before_seq, in: query, schema: { type: integer } }
        - { name: after_seq, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        '200':
          description: ascending messages + has_more flags
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  has_more_before: { type: boolean }
                  has_more_after: { type: boolean }
    post:
      summary: API-041 send message (idempotent by client_message_id)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [client_message_id, body]
              properties:
                client_message_id: { type: string, format: uuid }
                body: { type: string, maxLength: 4000 }
                reply_to_message_id: { type: string }
      responses:
        '201': { description: sent }
        '200': { description: idempotent replay of the same client_message_id }
        '422': { description: MSG_EMPTY / MSG_TOO_LONG / MSG_REPLY_INVALID }
  /rooms/{roomId}/read:
    post:
      summary: API-045 mark read (monotonic, clamped)
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/workspaceSlug' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [seq]
              properties:
                seq: { type: integer }
      responses: { '200': { description: last_read_seq } }
  /rooms/{roomId}/read-status:
    get:
      summary: API-046 per-member read positions
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/workspaceSlug' }
        - { name: seq, in: query, schema: { type: integer } }
      responses: { '200': { description: read_by list } }
  /broadcasting/auth:
    post:
      summary: API-090 authorize private channel (pusher protocol)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [socket_id, channel_name]
              properties:
                socket_id: { type: string }
                channel_name: { type: string, example: private-room.01J... }
      responses:
        '200': { description: "auth HMAC signature object" }
        '403': { description: not a member }
  /health:
    get:
      summary: liveness/readiness (db, redis, storage, reverb, queue lag)
      security: []
      responses:
        '200': { description: all checks ok }
        '503': { description: degraded, per-check detail }

  /directory:
    get:
      summary: API-138 paginated workspace directory (FR-WS-005)
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/workspaceSlug'}
        - {name: q, in: query, schema: {type: string, maxLength: 100}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50}}
      responses:
        '200': {description: 'data: {members: UserStub[], next_cursor: string|null}'}
        '403': {description: Not a workspace member}
  /rooms/{roomId}/notes:
    parameters:
      - {$ref: '#/components/parameters/workspaceSlug'}
      - {name: roomId, in: path, required: true, schema: {type: string}}
    get:
      summary: API-130 list room notes (FR-NOTE-001)
      security: [{bearerAuth: []}]
      parameters:
        - {name: before, in: query, schema: {type: string}, description: Last note ULID from preceding page}
      responses:
        '200': {description: 'data: {notes: [{id,room_id,author_id,author_name,body,attachments,created_at,updated_at}], has_more}; 30 notes/page'}
        '403': {description: Not a room member}
    post:
      summary: API-131 create room note (FR-NOTE-001)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: {type: [string, 'null'], maxLength: 20000}
                attachment_ids: {type: array, maxItems: 10, uniqueItems: true, items: {type: string}}
              description: At least nonblank body or one attachment; uploader/workspace ownership checked
      responses:
        '201': {description: 'data: note with author name and signed attachment URLs'}
        '422': {description: Invalid content or attachment claim}
        '403': {description: Not a room member}
  /rooms/{roomId}/notes/{noteId}:
    parameters:
      - {$ref: '#/components/parameters/workspaceSlug'}
      - {name: roomId, in: path, required: true, schema: {type: string}}
      - {name: noteId, in: path, required: true, schema: {type: string}}
    patch:
      summary: API-132 edit note text (author or admin)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: {type: [string, 'null'], maxLength: 20000}
      responses:
        '200': {description: Updated note in data envelope}
        '403': {description: Not author or room/workspace admin}
        '422': {description: Empty note}
    delete:
      summary: API-133 delete room note (author or admin)
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Deleted}
        '403': {description: Not author or room/workspace admin}
  /rooms/{roomId}/pins:
    parameters:
      - {$ref: '#/components/parameters/workspaceSlug'}
      - {name: roomId, in: path, required: true, schema: {type: string}}
    get:
      summary: API-134 pinned nondeleted messages, descending seq (FR-PIN-001)
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Message array in data envelope}
        '403': {description: Not a room member}
  /rooms/{roomId}/pins/{messageId}:
    parameters:
      - {$ref: '#/components/parameters/workspaceSlug'}
      - {name: roomId, in: path, required: true, schema: {type: string}}
      - {name: messageId, in: path, required: true, schema: {type: string}}
    put:
      summary: API-135 pin message idempotently (FR-PIN-001)
      security: [{bearerAuth: []}]
      responses:
        '200': {description: 'data: {pinned: true}'}
        '404': {description: Message absent, deleted or in another room}
        '403': {description: Not a room member}
    delete:
      summary: API-136 unpin message (FR-PIN-001)
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Unpinned}
        '403': {description: Not a room member}
  /rooms/{roomId}/typing:
    parameters:
      - {$ref: '#/components/parameters/workspaceSlug'}
      - {name: roomId, in: path, required: true, schema: {type: string}}
    post:
      summary: API-137 publish named typing state (FR-RT-003, EVT-062)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [typing], properties: {typing: {type: boolean}}}
      responses:
        '204': {description: Accepted, true updates throttled to one per two seconds}
        '403': {description: Not a room member}
