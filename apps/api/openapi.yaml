openapi: 3.1.0
info:
  title: Banana Chat (orgchat) API
  version: 1.1.2
  description: >
    PH1 surface of the self-hosted workspace chat API. All responses follow the
    §7 envelope: success `{data, meta?}`, error `{error:{code,message,details?,request_id}}`.
    Workspace-scoped endpoints require the `X-Workspace-Id` header (workspace slug).
servers:
  - url: http://localhost:8000/api/v1
    description: Local dev (D1 hybrid topology)

components:
  securitySchemes:
    mediaAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: LiveKit media token issued by API-152 or API-163; not an API access token.
    bearerAuth:
      type: http
      scheme: bearer
      description: access_token from /auth/login (60 min TTL)
    pchatHmac:
      type: apiKey
      in: header
      name: X-PChat-Key
      description: >
        FR-PCHAT-031 partner credential. The public key id (`pck_` + 28 hex) travels in this header and
        MUST be accompanied by X-PChat-Timestamp, X-PChat-Nonce and X-PChat-Signature, declared as
        required parameters on every partner operation. The signature is `v1=` + lowercase hex
        HMAC-SHA256 over exactly six "\n"-joined lines — `v1`, uppercase method, request path including
        /api/v1 and without query string, timestamp, nonce, and sha256 of the RAW request body bytes
        (sha256 of the empty string when there is no body). Sign the exact bytes put on the wire; never
        re-serialised JSON. Sign server-side only — never from browser JavaScript. Never a user session.
  parameters:
    workspaceSlug:
      name: X-Workspace-Id
      in: header
      required: true
      schema: { type: string }
      description: slug of the active workspace
    pchatCode:
      name: code
      in: path
      required: true
      schema: {type: string, pattern: '^[a-f0-9]{64}$'}
      description: >
        The visitor capability code (FR-PCHAT / DEC-063). Possession of it IS the identity. It must never
        appear in a query string, a channel name, a referrer header or an access log; the edge sets
        no-referrer, no-store and access_log off on both /support/ and /api/v1/public-chat/.
    pchatTimestamp:
      name: X-PChat-Timestamp
      in: header
      required: true
      schema: {type: integer}
      description: >
        Unix seconds, matched as \A-?[0-9]{1,19}\z. A value that is not a bare integer fails the
        envelope-shape check and is 401 API_KEY_INVALID; only a well-formed value outside +/-300s of
        server time is 401 API_TIMESTAMP_SKEW.
    pchatNonce:
      name: X-PChat-Nonce
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$'}
      description: >
        NOT merely "unique per request". The value must match \A[A-Za-z0-9_-]{16,64}\z exactly - 16 to
        64 characters drawn only from A-Z a-z 0-9 underscore and hyphen. A value outside that charset or
        length is rejected as part of the envelope-shape check and returns 401 API_KEY_INVALID; there is
        deliberately NO nonce-specific code for a malformed nonce. Single use per key: a well-formed
        nonce replayed within the 600s cache window (more than twice the skew window) is 409
        API_NONCE_REPLAYED, and that check runs only AFTER the signature verifies, so unsigned garbage
        cannot pre-consume a legitimate client's nonces.
    pchatSignature:
      name: X-PChat-Signature
      in: header
      required: true
      schema: {type: string, pattern: '^v1=[a-f0-9]{64}$'}
      description: See the pchatHmac security scheme for the canonical string. Compared in constant time.
  schemas:
    PublicMeeting:
      type: object
      required: [id, code, title, expires_at, ended_at, created_at]
      properties:
        id: {type: string}
        code: {type: string, pattern: '^[a-f0-9]{64}$'}
        title: {type: string, maxLength: 120}
        expires_at: {type: string, format: date-time}
        ended_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    MeetingJoin:
      type: object
      required: [meeting, participant_id, participant_token, url, token, can_end, workspace_slug]
      properties:
        meeting: {$ref: '#/components/schemas/PublicMeeting'}
        participant_id: {type: string}
        participant_token: {type: string, description: Private browser participant capability; never an API account token.}
        url: {type: string}
        token: {type: string}
        can_end: {type: boolean}
        workspace_slug: {type: [string, 'null'], description: Only returned to the meeting creator.}
    # ---- FR-PCHAT payload shapes ------------------------------------------
    # THE CODE IS THE CONTRACT. Every schema below was read back off
    # PublicChatPartnerController::partnerRoom(), PublicChatPublicSerializer and
    # PublicChatStaffSerializer and matches what ships. Note that NO public chat
    # response is wrapped in the §7 `{data}` envelope: each one is a top-level
    # object keyed by `room`, `rooms`, `message`, `messages`, `summary`,
    # `attachment`, etc. Generated clients must read those keys directly.
    PublicChatRoomPartner:
      type: object
      description: >
        Tier-1 partner view, returned under the top-level `room` key by API-200, API-202 and API-203.
        Status only, never message bodies. Every key listed is always present; absent values are null.
        API-201 returns this plus `message_count` - see PublicChatRoomPartnerCounted.
      required: [id, code, status, customer_name, provider_name, external_ref, locale, assigned_display_name, created_at, last_message_at, closed_at, expires_at]
      properties:
        id: {type: string, description: 'Room ULID. Partner routes address rooms by this, never by code.'}
        code:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: >
            The visitor capability code, returned INSIDE `room` - there is no top-level `code` key on
            any partner response. Combine with the sibling `url`, or build it as <APP_URL>/support/<code>.
        status: {type: string, enum: [new, in_progress, done, problem], description: 'The RAW internal status. The partner owns the ticket and sees `problem`; the visitor never does.'}
        customer_name: {type: string, maxLength: 120}
        provider_name: {type: string, maxLength: 120}
        external_ref: {type: [string, 'null'], maxLength: 120}
        locale: {type: string, enum: [th, en]}
        assigned_display_name:
          type: [string, 'null']
          description: >
            EXTERNAL display name only, built as "<provider_name> (<assignee username>)". Null while the
            room is unassigned. No user ULID and no internal display name ever reach this tier.
        created_at: {type: [string, 'null'], format: date-time}
        last_message_at: {type: [string, 'null'], format: date-time}
        closed_at: {type: [string, 'null'], format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
    PublicChatRoomPartnerCounted:
      description: >
        API-201 only. `message_count` is produced by the withCounts path of the controller and is
        emitted by NO other partner endpoint - do not expect it on API-200, API-202 or API-203.
      allOf:
        - {$ref: '#/components/schemas/PublicChatRoomPartner'}
        - type: object
          required: [message_count]
          properties:
            message_count: {type: integer, description: 'Non-deleted messages in the room, system rows included.'}
    PublicChatRoomVisitor:
      type: object
      description: >
        API-210 visitor view, returned under the top-level `room` key. Carries status_public, never the
        raw status - a customer must not learn that support flagged the conversation `problem`
        (FR-PCHAT-007). THE 64-HEX CODE IS NOT RETURNED: the visitor already holds it in the URL, and
        the serializer deliberately never serialises it. `id` IS returned, because the page needs the
        room ULID to subscribe to private-public-chat.{id}.
      required: [id, customer_name, provider_name, status_public, locale, created_at, expires_at, last_seq]
      properties:
        id: {type: string, description: 'Room ULID - the realtime channel key.'}
        customer_name: {type: string, maxLength: 120}
        provider_name: {type: string, maxLength: 120}
        status_public: {type: string, enum: [open, closed], description: 'open = new|in_progress|problem, closed = done'}
        locale: {type: string, enum: [th, en]}
        created_at: {type: [string, 'null'], format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        last_seq: {type: integer}
    PublicChatAttachment:
      type: object
      description: >
        The attachment envelope on both public chat tiers. The visitor serializer rebuilds these eleven
        fields by hand rather than delegating, so a field added to the internal serializer cannot reach
        the customer by accident; today the two shapes are identical.
      required: [id, kind, status, original_name, mime_type, size_bytes, width, height, duration_ms, urls, urls_expire_at]
      properties:
        id: {type: string}
        kind: {type: string, enum: [image, video, file]}
        status: {type: string}
        original_name: {type: string}
        mime_type: {type: string}
        size_bytes: {type: integer}
        width: {type: [integer, 'null']}
        height: {type: [integer, 'null']}
        duration_ms: {type: [integer, 'null']}
        urls:
          type: object
          required: [original, thumb_sm, thumb_md, poster]
          properties:
            original: {type: string}
            thumb_sm: {type: [string, 'null']}
            thumb_md: {type: [string, 'null']}
            poster: {type: [string, 'null']}
        urls_expire_at: {type: string, format: date-time}
    PublicChatMessageVisitor:
      type: object
      description: >
        Public payload (API-211, API-212, EVT-080 visitor variant). Contains no user ULID, no mentions,
        no read receipts, no assignee and no room meta; an agent appears only as `display_name`
        "<provider name> (<admin username>)" built from write-time snapshots (FR-PCHAT-014). A
        soft-deleted row is still returned as a tombstone - `deleted` true with display_name, body,
        system_event, system_meta and reply_to null and attachments empty - because removing it would
        renumber the customer's visible seq sequence. A zero-delta `status_changed` row is OMITTED
        entirely (DEC-074), so the visitor's seq sequence may contain permanent gaps.
      required: [id, seq, sender_kind, display_name, type, body, system_event, system_meta, reply_to, attachments, deleted, created_at]
      properties:
        id: {type: string}
        seq: {type: integer}
        sender_kind: {type: string, enum: [visitor, agent, system]}
        display_name:
          type: [string, 'null']
          description: >
            Agent rows - plain text "<provider name> (<admin username>)". Visitor rows - the customer's
            own name. System rows and tombstones - null. Never HTML, never Markdown.
        type: {type: string, enum: [text, image, video, file, system]}
        body: {type: [string, 'null'], description: 'Null on system rows (the client renders the sentence in the reader locale) and on tombstones.'}
        system_event: {type: [string, 'null'], enum: [claimed, reassigned, status_changed, closed_by_customer, null]}
        system_meta:
          type: [object, array, 'null']
          description: >
            Whitelisted and projected, and it can arrive as an EMPTY JSON ARRAY. For claimed and
            reassigned the serializer returns an empty PHP array, which json_encode emits as `[]`, never
            `{}` - the visitor never learns an agent identity. For status_changed only the PROJECTED
            from/to survive and a null side is dropped, so a row where neither side projects is `[]`
            too. A strictly typed client must accept `[]` here.
          properties:
            from: {type: string, enum: [open, closed]}
            to: {type: string, enum: [open, closed]}
        reply_to:
          type: [object, 'null']
          description: 'Snippet-only quote. Deliberately carries no sender id and no sender kind.'
          required: [id, seq, snippet]
          properties:
            id: {type: string}
            seq: {type: integer}
            snippet: {type: [string, 'null'], description: 'First 120 characters of the parent body; null when the parent is deleted.'}
        attachments: {type: array, items: {$ref: '#/components/schemas/PublicChatAttachment'}}
        deleted: {type: boolean, description: 'There is no deleted_at on this tier - the customer gets the fact, never the timing.'}
        created_at: {type: [string, 'null'], format: date-time}
    PublicChatRoomStaff:
      type: object
      description: >
        Internal payload for Tier 3 (API-220/221/223/224) and private-public-chat-staff.{room_id}.
        Carries the raw status, the assignee, meta and external_ref. It does NOT carry workspace_id,
        and it deliberately does NOT carry the 64-hex `code` - that is the visitor's bearer credential
        and an agent has no use for it.
      required: [id, customer_name, provider_name, external_ref, status, status_public, locale, assigned_to, claimed_at, first_response_at, needs_reply, last_seq, last_visitor_seq, last_agent_seq, my_last_read_seq, unread_count, last_message_at, created_at, expires_at, closed_at, meta]
      properties:
        id: {type: string}
        customer_name: {type: string}
        provider_name: {type: string}
        external_ref: {type: [string, 'null']}
        status: {type: string, enum: [new, in_progress, done, problem]}
        status_public: {type: string, enum: [open, closed]}
        locale: {type: string, enum: [th, en]}
        assigned_to:
          type: [object, 'null']
          required: [id, username, display_name]
          properties:
            id: {type: string}
            username: {type: string}
            display_name: {type: string}
        claimed_at: {type: [string, 'null'], format: date-time}
        first_response_at: {type: [string, 'null'], format: date-time}
        needs_reply: {type: boolean, description: 'last_visitor_seq > last_agent_seq AND status != done'}
        last_seq: {type: integer}
        last_visitor_seq: {type: integer}
        last_agent_seq: {type: integer}
        my_last_read_seq:
          type: integer
          description: >
            This agent's pointer from public_chat_reads. Populated on API-220 and API-221 only; API-223
            and API-224 serialise the room without a pointer, so both this and unread_count are computed
            from 0 there and must not be trusted as a read position on those two responses.
        unread_count: {type: integer, description: 'max(0, last_seq - my_last_read_seq).'}
        last_message_at: {type: [string, 'null'], format: date-time}
        created_at: {type: [string, 'null'], format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        closed_at: {type: [string, 'null'], format: date-time}
        meta: {type: [object, 'null'], description: 'The partner payload. Agent-only, rendered as preformatted JSON, never as HTML.'}
    PublicChatMessageStaff:
      type: object
      description: >
        Internal message payload (API-222/223/226 and private-public-chat-staff.{room_id}). There is no
        reply_to_message_id field on the response - the parent is expanded into `reply_to`.
      required: [id, room_id, seq, sender_kind, sender, external_display_name, visitor_display_name, type, body, system_event, system_meta, reply_to, attachments, client_message_id, deleted, deleted_at, deleted_by, created_at]
      properties:
        id: {type: string}
        room_id: {type: string}
        seq: {type: integer}
        sender_kind: {type: string, enum: [visitor, agent, system]}
        sender:
          type: [object, 'null']
          description: 'The internal user behind an agent row; null for visitor and system rows.'
          required: [id, username, display_name]
          properties:
            id: {type: string}
            username: {type: string}
            display_name: {type: string}
        external_display_name: {type: [string, 'null'], description: 'The exact string the customer sees for an agent row; null otherwise.'}
        visitor_display_name: {type: string, description: 'The room customer_name, repeated on every row so an agent can label visitor rows without a join.'}
        type: {type: string, enum: [text, image, video, file, system]}
        body: {type: [string, 'null'], description: 'Null on system rows and on a deleted row.'}
        system_event: {type: [string, 'null'], enum: [claimed, reassigned, status_changed, closed_by_customer, null]}
        system_meta: {type: [object, 'null'], description: 'RAW and unprojected - staff see {from, to, actor_username, from_user_id, to_user_id} exactly as written.'}
        reply_to:
          type: [object, 'null']
          required: [id, seq, sender_kind, snippet]
          properties:
            id: {type: string}
            seq: {type: integer}
            sender_kind: {type: string, enum: [visitor, agent, system]}
            snippet: {type: [string, 'null']}
        attachments: {type: array, items: {$ref: '#/components/schemas/PublicChatAttachment'}, description: 'Empty array on a deleted row.'}
        client_message_id: {type: string, description: 'Always present; system rows carry a generated value.'}
        deleted: {type: boolean}
        deleted_at: {type: [string, 'null'], format: date-time}
        deleted_by: {type: [string, 'null'], description: 'User ULID of the member who deleted the row.'}
        created_at: {type: [string, 'null'], format: date-time}
    PublicChatUploadTicket:
      type: object
      description: >
        API-213 and API-225. `attachment` carries ID AND STATUS ONLY - not the full attachment object.
        Exactly one of upload_url / multipart is present; the null one is stripped from the response
        entirely rather than sent as null.
      required: [attachment]
      properties:
        attachment:
          type: object
          required: [id, status]
          properties:
            id: {type: string}
            status: {type: string}
        upload_url: {type: string, format: uri, description: 'Single PUT. Present unless the upload crossed the multipart threshold.'}
        multipart:
          type: object
          description: 'Present instead of upload_url for an S3 multipart session.'
          required: [upload_id, part_size, part_urls]
          properties:
            upload_id: {type: string}
            part_size: {type: integer}
            part_urls: {type: array, items: {type: string}}
    RoomCall:
      type: object
      required: [id,room_id,workspace_id,kind,started_by,caller_name,room_type,participants,created_at]
      properties:
        id: {type: string}
        room_id: {type: string}
        workspace_id: {type: string}
        kind: {type: string, enum: [voice,video]}
        started_by: {type: string}
        caller_name: {type: string}
        room_name: {type: [string, 'null']}
        room_type: {type: string, enum: [dm,group]}
        participants: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
        connected_at: {type: [string, 'null'], format: date-time}
        ended_at: {type: [string, 'null'], format: date-time}
    CallJoin:
      type: object
      required: [call,token,url]
      properties:
        call: {$ref: '#/components/schemas/RoomCall'}
        token: {type: string, description: 'Short-lived media JWT; never persist or log.'}
        url: {type: string, format: uri}
    KanbanLaneInput:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 60}
        color: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        position: {type: integer, minimum: 0, maximum: 100}
        is_done: {type: boolean}
    KanbanTicketInput:
      description: FR-KAN-006; ticket responses include ordered attachments using the standard Attachment shape. Omitted attachment_ids preserves existing images; empty array removes all.
      type: object
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: [string, 'null'], maxLength: 20000}
        lane_id: {type: string}
        type: {type: string, enum: [task,bug,story]}
        priority: {type: string, enum: [low,medium,high,urgent]}
        assignee_id: {type: [string, 'null']}
        due_at: {type: [string, 'null'], format: date-time}
        labels: {type: array, maxItems: 10, items: {type: string, maxLength: 30}}
        attachment_ids: {type: array, maxItems: 20, uniqueItems: true, items: {type: string}, description: "New IDs must be completed image uploads owned by the actor in this workspace and not already linked."}
        version: {type: integer, minimum: 1}
    UploadTicket:
      description: API-060 / FR-MEDIA-001; multipart is returned for S3 uploads above the configured threshold.
      type: object
      required: [attachment_id, put_url, headers, expires_at]
      properties:
        attachment_id: { type: string }
        put_url: { type: [string, 'null'] }
        headers: { type: object, additionalProperties: { type: string } }
        expires_at: { type: string, format: date-time }
        multipart:
          type: [object, 'null']
          required: [upload_id, part_size, part_urls]
          properties:
            upload_id: { type: string }
            part_size: { type: integer, minimum: 1 }
            part_urls: { type: array, items: { type: string } }
    CompleteUpload:
      description: API-061; omit the body for single PUT, provide ordered S3 ETags for multipart.
      type: object
      properties:
        parts:
          type: array
          items:
            type: object
            required: [part_number, etag]
            properties:
              part_number: { type: integer, minimum: 1 }
              etag: { type: string }
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string, example: MSG_TOO_LONG }
            message: { type: string }
            details:
              type: object
              description: e.g. VALIDATION_FAILED carries details.fields
            request_id: { type: [string, 'null'] }
    UserStub:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        avatar_attachment_id: { type: [string, 'null'] }
    WorkspaceSummary:
      type: object
      properties:
        workspace:
          type: object
          properties:
            id: { type: string }
            slug: { type: string }
            name: { type: string }
            status: { type: string, enum: [active, archived] }
        role: { type: string, enum: [owner, admin, member] }
        unread_rooms_count: { type: integer }
        total_unread: { type: integer }
    RoomListItem:
      type: object
      properties:
        room:
          type: object
          properties:
            id: { type: string }
            workspace_id: { type: string }
            type: { type: string, enum: [dm, group, channel] }
            name: { type: [string, 'null'] }
            description: { type: [string, 'null'] }
            last_seq: { type: integer }
            member_count: { type: integer }
            last_message_at: { type: [string, 'null'] }
            is_secret:
              type: boolean
              description: FR-ROOM-012 — secret (auto-expiring) room
            secret_expires_at:
              type: [string, 'null']
              format: date-time
              description: expiry instant; every room-scoped access returns 410 ROOM_EXPIRED from this moment
        my_role: { type: string, enum: [owner, admin, member] }
        other_user: { $ref: '#/components/schemas/UserStub' }
        last_message:
          type: [object, 'null']
          description: stub of the newest message
        unread_count: { type: integer }
        muted: { type: boolean }
    Message:
      type: object
      properties:
        id: { type: string }
        room_id: { type: string }
        workspace_id: { type: string }
        sender_id: { type: string }
        sender: { $ref: '#/components/schemas/UserStub' }
        type: { type: string, enum: [text, system, media, file] }
        body: { type: [string, 'null'] }
        seq: { type: integer }
        client_message_id: { type: [string, 'null'] }
        reply_to: { type: [object, 'null'] }
        system_event: { type: [object, 'null'] }
        edited_at: { type: [string, 'null'] }
        edit_count: { type: integer }
        deleted_at: { type: [string, 'null'] }
        delete_reason: { type: [string, 'null'] }
        created_at: { type: string }
        attachments:
          type: array
          items: { type: object }

security:
  - bearerAuth: []

paths:
  /meetings:
    parameters:
      - {$ref: '#/components/parameters/workspaceSlug'}
    get:
      summary: API-160 — List own meeting links in the workspace (latest 100)
      responses:
        '200':
          description: Creator-owned links
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/PublicMeeting'}}
    post:
      summary: API-160 — Create a public video meeting link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: {type: string, minLength: 1, maxLength: 120}
                expires_in_hours: {type: integer, minimum: 1, maximum: 168, default: 168}
      responses:
        '201':
          description: Meeting created
          content:
            application/json:
              schema: {type: object, properties: {data: {$ref: '#/components/schemas/PublicMeeting'}}}
        '429': {description: Create rate limit exceeded}
  /meetings/{id}/end:
    post:
      summary: API-161 — Creator ends a meeting and permanently revokes its link
      parameters:
        - {$ref: '#/components/parameters/workspaceSlug'}
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Ended}
        '404': {description: Not found or not creator in this workspace}
  /public-meetings/{code}:
    get:
      summary: API-162 — Public lobby and optional verified account identity
      security: [{}, {bearerAuth: []}]
      parameters:
        - {name: code, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{64}$'}}
      responses:
        '200':
          description: No workspace or chat content; supplied bearer credentials must be valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      title: {type: string}
                      expires_at: {type: string, format: date-time}
                      capacity: {type: integer}
                      identity:
                        type: [object, 'null']
                        properties:
                          name: {type: string}
                          member: {type: boolean, const: true}
        '410': {description: 'Expired, ended or creator/workspace unavailable'}
        '401': {description: Supplied account credentials invalid}
        '403': {description: Account suspended or password change required}
        '404': {description: Unknown link}
  /public-meetings/{code}/join:
    post:
      summary: API-163 — Join as verified member or named guest
      security: [{}, {bearerAuth: []}]
      parameters:
        - {name: code, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{64}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 80, description: Required for a new anonymous participant; ignored for members.}
                participant_token: {type: string, minLength: 64, maxLength: 64, description: Optional private rejoin capability. Rotated on successful join.}
      responses:
        '200':
          description: Meeting-specific media credentials; never grants workspace membership
          content:
            application/json:
              schema: {type: object, properties: {data: {$ref: '#/components/schemas/MeetingJoin'}}}
        '409': {description: Full or member active on another session}
        '410': {description: Link unavailable}
        '422': {description: Missing or invalid guest name}
        '429': {description: Join rate limit exceeded}
  /public-meetings/{code}/leave:
    post:
      summary: API-164 — Leave using a private participant capability
      security: []
      parameters:
        - {name: code, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{64}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participant_token]
              properties:
                participant_token: {type: string}
      responses:
        '204': {description: Participant revoked}
        '403': {description: Wrong participant capability}
