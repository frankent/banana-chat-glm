      summary: API-143 Delete empty lane (owner/admin)
      security: [{bearerAuth: []}]
      responses:
        '204': {description: 'Deleted'}
        '409': {description: 'Lane occupied or last remaining lane'}
  /board/tickets:
    parameters: [{$ref: '#/components/parameters/workspaceSlug'}]
    get:
      summary: API-144 List tickets in this workspace, newest first (100/page)
      security: [{bearerAuth: []}]
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: assignee, in: query, schema: {type: string}, description: User ULID or me}
        - {name: priority, in: query, schema: {type: string, enum: [low,medium,high,urgent]}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200': {description: 'data: {tickets: Ticket[], next_cursor: string|null}'}
    post:
      summary: API-145 Create ticket (all members)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/KanbanTicketInput'}
                - {required: [title,lane_id]}
      responses:
        '201': {description: 'Created ticket in data, version 1'}
        '422': {description: 'Invalid lane/assignee/fields'}
  /board/tickets/{id}:
    parameters:
      - {$ref: '#/components/parameters/workspaceSlug'}
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      summary: API-146 Ticket detail with latest 50 comments and 100 history entries
      security: [{bearerAuth: []}]
      parameters:
        - {name: before, in: query, schema: {type: string}, description: Older comments ULID cursor}
      responses:
        '200': {description: 'Ticket in data with comments/comments_cursor/history'}
        '404': {description: 'Foreign or unknown ticket'}
    patch:
      summary: API-147 Update/move ticket (all members, optimistic version)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/KanbanTicketInput'}
                - {required: [version]}
      responses:
        '200': {description: 'Updated ticket in data'}
        '409': {description: 'Stale version, reload before editing'}
        '404': {description: 'Foreign or unknown ticket'}
  /board/tickets/{id}/comments:
    post:
      summary: API-148 Add immutable Markdown comment
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/workspaceSlug'}
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, minLength: 1, maxLength: 10000}
      responses:
        '201': {description: 'Created comment in data'}


  # ---------------------------------------------------------------------------
  # FR-PCHAT — public support chat (PRODUCT_SPEC §5.18, §8.10)
  # Tier 1 partner (HMAC) · Tier 2 visitor (unauthenticated, the code is the credential)
  # Tier 3 support agent (existing bearer + X-Workspace-Id).
  # Concrete Tier-3 prefixes are declared BEFORE /public-chat/{code} so a first-fit
  # matcher never routes /public-chat/rooms into the templated visitor path.
  #
  # ENVELOPE — READ THIS BEFORE GENERATING A CLIENT. No public chat endpoint uses
  # the §7 `{data, meta}` success envelope. Every success body is a top-level
  # object keyed by `room`, `rooms`, `message`, `messages`, `summary`,
  # `attachment`, `auth` or `ok`, exactly as written under each response below.
  #
  # THE FEATURE GATE IS NOT UNIFORM (DEC-067). Writes 503; reads and API-201 keep
  # answering. Gated: API-200, 202, 203, 212, 213, 214, 216, 223, 224, 225, 226
  # and the Tier-3 typing route. NOT gated: API-201, 210, 211, 215, 220, 221,
  # 222, 227, 228. On Tier 1 and Tier 3 the gate runs BEFORE request validation,
  # so a malformed body while the feature is off is 503, never 422.
  #
  # 404 COMES IN TWO FLAVOURS AND A CLIENT BRANCHING ON `error.code` MUST KNOW.
  # A request that never reaches a controller — a {code} that is not 64 lowercase
  # hex, a 64-hex value where a partner route wants a ULID, a ULID where a
  # visitor route wants a code — is rejected by the route constraint and renders
  # as the generic `NOT_FOUND`. `PCHAT_ROOM_NOT_FOUND` is only ever produced by a
  # controller that ran and found no row (including another workspace's room, a
  # rotated code, and a rejected channel_name on API-215).
  #
  # 429 on any of these renders as `RATE_LIMITED` with `details.retry_after_seconds`
  # and a `Retry-After` header. `error.request_id` is also returned as the
  # `X-Request-Id` response header on every request, success or failure.
  # ---------------------------------------------------------------------------
  /partner/public-chat/rooms:
    post:
      summary: API-200 — Create a support conversation and return its visitor link
      description: >
        Idempotent on external_ref, per workspace - a repeat with the same external_ref returns 200 with
        the same room and the same code, not an error and not a duplicate. Never issues a user session.
        The feature gate runs FIRST - while publicchat.enabled is false this is 503 even for a body that
        would not validate. `locale` accepts exactly 'th' or 'en'; omitted or null defaults to 'th' and
        any other value is 422, never a silent fallback. `meta` is capped at 8192 bytes measured on the
        json_encode output, which \u-escapes non-ASCII - Thai text therefore costs roughly six bytes per
        character, so the practical Thai limit is near 1300 characters, not 8192.
      security: [{pchatHmac: []}]
      parameters:
        - {$ref: '#/components/parameters/pchatTimestamp'}
        - {$ref: '#/components/parameters/pchatNonce'}
        - {$ref: '#/components/parameters/pchatSignature'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_name, provider_name]
              properties:
                customer_name: {type: string, minLength: 1, maxLength: 120}
                provider_name: {type: string, minLength: 1, maxLength: 120}
                external_ref: {type: [string, 'null'], maxLength: 120, description: "Partner's own ticket id; makes create idempotent within the workspace."}
                locale: {type: [string, 'null'], enum: [th, en, null], default: th}
                meta: {type: [object, 'null'], description: 'Free-form partner payload. Max 8192 bytes of json_encode output. Never served to the visitor.'}
      responses:
        '201':
          description: 'Created. Top-level `room` and `url` - there is no `data` wrapper and no top-level `code`.'
          content:
            application/json:
              schema:
                type: object
                required: [room, url]
                properties:
                  room: {$ref: '#/components/schemas/PublicChatRoomPartner'}
                  url: {type: string, format: uri, description: '<APP_URL>/support/<room.code>. The URL is bearer authority - deliver it over a private channel.'}
        '200':
          description: 'Idempotent replay of the same external_ref. Identical body to 201, same room id and same code.'
          content:
            application/json:
              schema:
                type: object
                required: [room, url]
                properties:
                  room: {$ref: '#/components/schemas/PublicChatRoomPartner'}
                  url: {type: string, format: uri}
        '401':
          description: >
            API_KEY_INVALID (missing or malformed header, unknown or revoked key, inactive workspace,
            undecryptable secret; a nonce outside \A[A-Za-z0-9_-]{16,64}\z lands here too - there is no
            nonce-specific format code) / API_SIGNATURE_INVALID / API_TIMESTAMP_SKEW beyond +/-300s.
        '409': {description: 'API_NONCE_REPLAYED - the nonce was already used within its 600s cache window.'}
        '422': {description: 'VALIDATION_FAILED. `details.fields.meta` for the 8KB cap, `details.fields.locale` for a locale other than th or en.'}
        '429': {description: 'RATE_LIMITED. Named limiter pchat-create, 60/min keyed by X-PChat-Key, never by IP.'}
        '503': {description: 'PCHAT_DISABLED with Retry-After 60, returned only after the signature verified, and before body validation.'}
  /partner/public-chat/rooms/{id}:
    get:
      summary: API-201 — Partner status read (no message bodies; the ONLY partner endpoint that is not feature-gated)
      description: >
        DEC-067 - this endpoint answers 200 even while publicchat.enabled is false, so a partner polling
        ticket status does not see their integration break when an admin pauses new conversations. It is
        the only partner endpoint that also returns `message_count`.
      security: [{pchatHmac: []}]
      parameters:
        - {$ref: '#/components/parameters/pchatTimestamp'}
        - {$ref: '#/components/parameters/pchatNonce'}
        - {$ref: '#/components/parameters/pchatSignature'}
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}, description: 'Room ULID. A 64-hex code here fails the route constraint and renders as generic NOT_FOUND - the visitor credential never travels in a partner path.'}
      responses:
        '200':
          description: 'Top-level `room` only - no `data` wrapper, no `url`.'
          content:
            application/json:
              schema:
                type: object
                required: [room]
                properties:
                  room: {$ref: '#/components/schemas/PublicChatRoomPartnerCounted'}
        '401': {description: 'Signature, key, nonce shape or skew rejected.'}
        '404': {description: "PCHAT_ROOM_NOT_FOUND, including another workspace's room. A malformed id is the generic NOT_FOUND instead."}
        '410': {description: 'PCHAT_LINK_EXPIRED - the room row is soft-deleted. The partner learns the conversation ended rather than that their id is wrong.'}
        '429': {description: 'RATE_LIMITED. Named limiter pchat-partner, 120/min keyed by X-PChat-Key.'}
  /partner/public-chat/rooms/{id}/close:
    post:
      summary: API-202 — Close the conversation (status done)
      description: >
        Returns the FULL room object under `room`, not a status stub. `message_count` is NOT included -
        only API-201 emits it. The visitor keeps read-only access to the transcript.
      security: [{pchatHmac: []}]
      parameters:
        - {$ref: '#/components/parameters/pchatTimestamp'}
        - {$ref: '#/components/parameters/pchatNonce'}
        - {$ref: '#/components/parameters/pchatSignature'}
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
      responses:
        '200':
          description: 'Closed. status is `done` and closed_at is set.'
          content:
            application/json:
              schema:
                type: object
                required: [room]
                properties:
                  room: {$ref: '#/components/schemas/PublicChatRoomPartner'}
        '401': {description: 'Signature, key, nonce shape or skew rejected.'}
        '404': {description: PCHAT_ROOM_NOT_FOUND}
        '409': {description: 'PCHAT_ROOM_CLOSED - a double close is a partner bug worth reporting, not a silent no-op.'}
        '410': {description: PCHAT_LINK_EXPIRED}
        '429': {description: 'RATE_LIMITED. Named limiter pchat-partner.'}
        '503': {description: 'PCHAT_DISABLED with Retry-After 60.'}
  /partner/public-chat/rooms/{id}/rotate-link:
    post:
      summary: API-203 — Mint a new visitor code; the old one 404s immediately
      description: >
        The remedy for a leaked capability URL short of ending the conversation. Messages, status and
        assignment are unchanged and the partner MUST re-deliver the new URL. Does not forcibly
        disconnect an already-connected socket - the channel is keyed by room id, not by code - but the
        old code cannot send, reload or re-authorise. Rotation also extends expires_at by the configured
        link TTL. THE NEW CODE IS RETURNED INSIDE `room`, as room.code; there is no top-level `code` key.
      security: [{pchatHmac: []}]
      parameters:
        - {$ref: '#/components/parameters/pchatTimestamp'}
        - {$ref: '#/components/parameters/pchatNonce'}
        - {$ref: '#/components/parameters/pchatSignature'}
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
      responses:
        '200':
          description: 'Rotated. Top-level `room` (carrying the NEW room.code) and `url`.'
          content:
            application/json:
              schema:
                type: object
                required: [room, url]
                properties:
                  room: {$ref: '#/components/schemas/PublicChatRoomPartner'}
                  url: {type: string, format: uri, description: '<APP_URL>/support/<the new room.code>.'}
        '401': {description: 'Signature, key, nonce shape or skew rejected.'}
        '404': {description: PCHAT_ROOM_NOT_FOUND}
        '409': {description: 'PCHAT_ROOM_CLOSED - a done conversation cannot have its link rotated.'}
        '410': {description: PCHAT_LINK_EXPIRED}
        '429': {description: 'RATE_LIMITED. Named limiter pchat-partner.'}
        '503': {description: 'PCHAT_DISABLED with Retry-After 60.'}
  /public-chat/rooms:
    get:
      summary: API-220 — Support queue for every active member of the workspace
      description: >
        All filtering is server-side. q matches customer_name, provider_name, external_ref AND message
        bodies. Default order is triage order - problem first, then needs_reply, then last_message_at
        DESC NULLS LAST, id DESC - and is identical for every viewer; the per-agent read pointer never
        enters the sort. A read, so it keeps answering while the feature is off.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/workspaceSlug'}
        - {name: status, in: query, schema: {type: string, maxLength: 64}, description: 'CSV of new|in_progress|done|problem. Unknown values are ignored, not rejected.'}
        - {name: assigned, in: query, schema: {type: string, maxLength: 40}, description: "ULID, 'me', 'none' or 'all'."}
        - {name: q, in: query, schema: {type: string, maxLength: 120}}
        - {name: needs_reply, in: query, schema: {type: boolean}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 64}, description: 'Opaque by contract. v1 encodes an offset; treat it as a token so it can become a keyset later.'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 30}}
      responses:
        '200':
          description: 'Top-level `rooms` and `next_cursor`. NOT `{data, meta}` - there is no meta object on this endpoint.'
          content:
            application/json:
              schema:
                type: object
                required: [rooms, next_cursor]
                properties:
                  rooms: {type: array, items: {$ref: '#/components/schemas/PublicChatRoomStaff'}}
                  next_cursor: {type: [string, 'null'], description: 'Null on the last page.'}
        '422': {description: VALIDATION_FAILED}
  /public-chat/summary:
    get:
      summary: API-227 — Rail badge counters
      description: 'A read, so it keeps answering while the feature is off - the rail shows a paused chip instead of vanishing.'
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/workspaceSlug'}]
      responses:
        '200':
          description: 'Top-level `summary` and `feature_enabled`. Six counters, not four.'
          content:
            application/json:
              schema:
                type: object
                required: [summary, feature_enabled]
                properties:
                  summary:
                    type: object
                    required: [new, in_progress, problem, done, mine, needs_reply]
                    properties:
                      new: {type: integer}
                      in_progress: {type: integer}
                      problem: {type: integer}
                      done: {type: integer}
                      mine: {type: integer, description: 'Rooms assigned to the caller whose status is not done.'}
                      needs_reply: {type: integer}
                  feature_enabled: {type: boolean}
  /public-chat/messages/{id}:
    delete:
      summary: API-226 — Soft-delete any message in a support conversation
      description: >
        Any active workspace member, audited as public_chat.message_deleted. Deliberately its own
        endpoint - the internal moderation path resolves a NULL-sender row to a room-role check that no
        support agent holds, which would make a visitor message undeletable by anyone. Deleting an
        already-deleted message is a no-op that still returns 200 with the tombstone.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/workspaceSlug'}
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
      responses:
        '200':
          description: >
            NOT 204. The tombstone row is returned under a top-level `message` key - body null,
            attachments empty, deleted true - because the row stays in every query result and each
            serializer renders the tombstone. EVT-083 is emitted on both room channels.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {$ref: '#/components/schemas/PublicChatMessageStaff'}
        '404': {description: "PCHAT_ROOM_NOT_FOUND for an unknown message or another workspace's message. A non-ULID id is the generic NOT_FOUND."}
        '503': {description: 'PCHAT_DISABLED, checked before the message is looked up.'}
  /public-chat/rooms/{id}:
    parameters:
      - {$ref: '#/components/parameters/workspaceSlug'}
      - {name: id, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
    get:
      summary: API-221 — Conversation detail for an agent
      description: 'A read, so it keeps answering while the feature is off. my_last_read_seq and unread_count are this caller''s.'
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: 'Top-level `room`.'
          content:
            application/json:
              schema:
                type: object
                required: [room]
                properties:
                  room: {$ref: '#/components/schemas/PublicChatRoomStaff'}
        '404': {description: "PCHAT_ROOM_NOT_FOUND - unknown, soft-deleted, or another workspace's room."}
    patch:
      summary: API-224 — Change status and/or assignee
      description: >
        Writes a system row in the same locked transaction and emits EVT-081. The presence of the KEY is
        what requests a change, so `{"assigned_to": null}` is an explicit unassign while omitting it
        leaves the assignee alone. The only transition guard is that a room may not sit in any status
        other than `new` with a NULL assignee - that one rule blocks both "leave new while unassigned"
        and "unassign while in_progress". A status string outside the enum fails request validation and
        is 422 VALIDATION_FAILED, NOT PCHAT_INVALID_TRANSITION. The gate runs before validation.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: {type: string, enum: [new, in_progress, done, problem]}
                assigned_to: {type: [string, 'null'], description: 'ULID of an active member of the same workspace, or null to unassign.'}
      responses:
        '200':
          description: 'Top-level `room`. A no-op patch returns 200 with the unchanged room and emits nothing.'
          content:
            application/json:
              schema:
                type: object
                required: [room]
                properties:
                  room: {$ref: '#/components/schemas/PublicChatRoomStaff'}
        '404': {description: PCHAT_ROOM_NOT_FOUND}
        '422': {description: 'PCHAT_INVALID_TRANSITION for the assignee guard; VALIDATION_FAILED for a bad enum value or an assignee who is not an active member (details.fields.assigned_to).'}
        '503': {description: 'PCHAT_DISABLED, before validation.'}
  /public-chat/rooms/{id}/messages:
    parameters:
      - {$ref: '#/components/parameters/workspaceSlug'}
      - {name: id, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
    get:
      summary: API-222 — Agent transcript
      description: >
        after_seq gap-fills ascending from the last seen seq; otherwise history is read newest-first and
        flipped, so the client always receives ascending seq whichever branch served it. A read, so it
        keeps answering while the feature is off.
      security: [{bearerAuth: []}]
      parameters:
        - {name: before_seq, in: query, schema: {type: integer, minimum: 0}}
        - {name: after_seq, in: query, schema: {type: integer, minimum: 0}, description: 'Takes precedence over before_seq when both are sent.'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: >
            Top-level `messages` and `last_seq`. There is NO meta object and NO has_more_before /
            has_more_after - page by comparing the returned seq range against last_seq.
          content:
            application/json:
              schema:
                type: object
                required: [messages, last_seq]
                properties:
                  messages: {type: array, items: {$ref: '#/components/schemas/PublicChatMessageStaff'}}
                  last_seq: {type: integer}
        '404': {description: PCHAT_ROOM_NOT_FOUND}
    post:
      summary: API-223 — Agent reply; the first one auto-claims the conversation
      description: >
        Inside the same lockForUpdate transaction that assigns seq, an unassigned room gets assigned_to,
        status in_progress, claimed_at and first_response_at plus one `claimed` system row, so exactly
        one claim under concurrent replies is a database guarantee. The response carries the room
        alongside the message precisely so the caller sees that claim without a refetch.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_message_id]
              properties:
                client_message_id: {type: string, format: uuid, description: 'Must be a UUID. Uniqueness is per (room_id, sender_kind, client_message_id).'}
                body: {type: [string, 'null']}
                attachment_ids: {type: array, maxItems: 10, items: {type: string}}
                reply_to_message_id: {type: [string, 'null'], description: 'ULID of a message in the same support conversation.'}
      responses:
        '201':
          description: 'Created. Top-level `message` AND `room` - the room reflects any auto-claim just applied.'
          content:
            application/json:
              schema:
                type: object
                required: [message, room]
                properties:
                  message: {$ref: '#/components/schemas/PublicChatMessageStaff'}
                  room: {$ref: '#/components/schemas/PublicChatRoomStaff'}
        '200':
          description: 'Idempotent replay of the same client_message_id for this sender_kind. Same body as 201.'
          content:
            application/json:
              schema:
                type: object
                required: [message, room]
                properties:
                  message: {$ref: '#/components/schemas/PublicChatMessageStaff'}
                  room: {$ref: '#/components/schemas/PublicChatRoomStaff'}
        '404': {description: PCHAT_ROOM_NOT_FOUND}
        '409': {description: PCHAT_ROOM_CLOSED}
        '422': {description: 'VALIDATION_FAILED, or the message-layer codes MSG_EMPTY, MSG_TOO_LONG, MSG_REPLY_INVALID, MSG_ATTACHMENT_INVALID.'}
        '429': {description: 'RATE_LIMITED. Named limiter pchat-agent-write, 60/min keyed by user id.'}
        '503': {description: 'PCHAT_DISABLED, before validation.'}
  /public-chat/rooms/{id}/uploads:
    post:
      summary: API-225 — Agent upload ticket (uploader_id = the agent AND public_chat_room_id = the room)
      description: >
        Completion goes through the existing API-061, which asserts uploader_id === the caller. Browser
        executable mime types including svg/xml are refused on this surface (DEC-072).
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/workspaceSlug'}
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, filename, mime_type, size_bytes]
              properties:
                kind: {type: string, enum: [image, video, file]}
                filename: {type: string, maxLength: 255}
                mime_type: {type: string, maxLength: 255}
                size_bytes: {type: integer, minimum: 1}
                sha256: {type: [string, 'null'], minLength: 64, maxLength: 64}
      responses:
        '201':
          description: 'Top-level `attachment` plus exactly one of `upload_url` / `multipart`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicChatUploadTicket'}
        '404': {description: PCHAT_ROOM_NOT_FOUND}
        '422': {description: 'VALIDATION_FAILED, MEDIA_TYPE_BLOCKED, MEDIA_MIME_MISMATCH or MEDIA_TOO_LARGE.'}
        '429': {description: 'RATE_LIMITED. Named limiter pchat-agent-write.'}
        '503': {description: 'PCHAT_DISABLED, before validation.'}
  /public-chat/rooms/{id}/read:
    post:
      summary: API-228 — Advance this agent's personal read pointer
      description: >
        NOT feature-gated - it keeps working while the feature is off. Monotonic at the database level
        via an ON CONFLICT GREATEST upsert, so a lower seq is a no-op rather than a rewind and two tabs
        cannot race backwards. The response reports the pointer ACTUALLY in force, so a client that sent
        a stale value learns the truth. A read pointer never affects queue order.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/workspaceSlug'}
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [seq], properties: {seq: {type: integer, minimum: 0}}}
      responses:
        '200':
          description: 'Flat top-level object - `room_id`, `last_read_seq`, `unread_count`. No `data` wrapper and no room object.'
          content:
            application/json:
              schema:
                type: object
                required: [room_id, last_read_seq, unread_count]
                properties:
                  room_id: {type: string}
                  last_read_seq: {type: integer, description: 'The pointer in force after the upsert, which may be higher than the seq sent.'}
                  unread_count: {type: integer}
        '404': {description: PCHAT_ROOM_NOT_FOUND}
        '422': {description: VALIDATION_FAILED}
  /public-chat/rooms/{id}/typing:
    post:
      summary: EVT-085 staff side — an agent typing, shown to the customer as "support is typing"
      description: >
        Present in the shipped routes and absent from earlier revisions of this document. Emits both the
        visitor frame (sender_kind only) and the staff frame (sender_kind plus the agent identity). The
        request body is ignored entirely - nothing is validated and nothing is required.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/workspaceSlug'}
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
      responses:
        '202':
          description: 'Accepted. Body is `{"ok": true}` - a 202 with a body, not a 204.'
          content:
            application/json:
              schema: {type: object, required: [ok], properties: {ok: {type: boolean, const: true}}}
        '404': {description: PCHAT_ROOM_NOT_FOUND}
        '429': {description: 'RATE_LIMITED. Named limiter pchat-agent-typing, 60/min keyed by user id, deliberately separate from the send budget.'}
        '503': {description: PCHAT_DISABLED}
  /public-chat/{code}:
    get:
      summary: API-210 — Visitor page bootstrap (unauthenticated; the code is the credential)
      description: >
        Returns status_public, never the raw status. Deliberately 200 while the feature is off, not 503 -
        feature_enabled and can_send carry the real answer so the page shows a calm banner over a still
        readable transcript. Any VALID bearer makes the caller a read-only viewer (FR-PCHAT-013); note
        that workspace membership is deliberately NOT consulted - being signed in at all is the
        disqualifier. An invalid or expired bearer is 401 AUTH_TOKEN_INVALID and never silently becomes
        an anonymous visitor. Every Tier-2 response carries Cache-Control no-store (API-215 sets that and
        nothing else). Referrer-Policy is NOT reliably no-referrer from the application - the global
        security-headers middleware runs outermost and overwrites it with strict-origin-when-cross-origin
        - so no-referrer on /support/ and /api/v1/public-chat/ is enforced at the nginx edge.
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/pchatCode'}]
      responses:
        '200':
          description: 'Five top-level keys. No `data` wrapper.'
          content:
            application/json:
              schema:
                type: object
                required: [room, viewer, feature_enabled, can_send, closed_reason]
                properties:
                  room: {$ref: '#/components/schemas/PublicChatRoomVisitor'}
                  viewer:
                    type: [object, 'null']
                    description: 'Non-null only when a valid bearer was presented. Membership is not checked.'
                    required: [kind, display_name]
                    properties:
                      kind: {type: string, const: member}
                      display_name: {type: string}
                  feature_enabled: {type: boolean}
                  can_send: {type: boolean, description: 'feature_enabled AND not expired AND status_public is open AND viewer is null.'}
                  closed_reason: {type: [string, 'null'], enum: [done, disabled, null], description: "'disabled' wins over 'done' when the feature is off."}
        '401': {description: 'AUTH_TOKEN_INVALID - a bearer was supplied and it was invalid or expired.'}
        '404': {description: 'PCHAT_ROOM_NOT_FOUND - unknown code, including a code retired by API-203 rotate-link. A code that is not 64 lowercase hex fails the route constraint and is the generic NOT_FOUND instead.'}
        '410': {description: 'PCHAT_LINK_EXPIRED (past expires_at or soft-deleted), with details.expires_at.'}
        '429': {description: "RATE_LIMITED. Named limiter pchat-visitor-read, 120/min keyed by code so one visitor cannot exhaust another's budget."}
  /public-chat/{code}/messages:
    parameters: [{$ref: '#/components/parameters/pchatCode'}]
    get:
      summary: API-211 — Visitor transcript and reconnect catch-up
      description: >
        Ascending by seq. A read, so it answers while the feature is off. Zero-delta status_changed rows
        are omitted (DEC-074), so the returned seq sequence may contain permanent gaps - advance the
        cursor from the highest seq RECEIVED and never compare it against room.last_seq.
      security: [{}, {bearerAuth: []}]
      parameters:
        - {name: after_seq, in: query, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        '200':
          description: 'Top-level `messages` and `last_seq`. No `data` wrapper.'
          content:
            application/json:
              schema:
                type: object
                required: [messages, last_seq]
                properties:
                  messages: {type: array, items: {$ref: '#/components/schemas/PublicChatMessageVisitor'}}
                  last_seq: {type: integer, description: 'The room pointer, which may exceed the highest seq returned because of suppressed rows.'}
        '401': {description: 'AUTH_TOKEN_INVALID - a dead bearer is 401 even on a read.'}
        '404': {description: PCHAT_ROOM_NOT_FOUND}
        '410': {description: PCHAT_LINK_EXPIRED}
        '422': {description: VALIDATION_FAILED}
        '429': {description: 'RATE_LIMITED. Named limiter pchat-visitor-read.'}
    post:
      summary: API-212 — Visitor sends a message
      description: >
        sender_kind is set server-side from the tier and can never be supplied; Tier 2 has no code path
        that writes `agent`. A visitor message never auto-reopens a done room (DEC-069). The write gate
        runs first - feature on, not signed in, room open - so 503 and 403 both precede validation.
      security: [{}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_message_id]
              properties:
                client_message_id: {type: string, format: uuid, description: 'Required here, unlike the member endpoint, and must be a UUID (422 otherwise). Uniqueness is per (room_id, sender_kind, client_message_id).'}
                body: {type: [string, 'null']}
                reply_to_message_id: {type: [string, 'null'], description: 'ULID of a message in the same conversation. Accepted here, contrary to earlier revisions of this document.'}
                attachment_ids: {type: array, maxItems: 10, items: {type: string}}
      responses:
        '201':
          description: 'Created. Top-level `message` only - no room object on this tier.'
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {$ref: '#/components/schemas/PublicChatMessageVisitor'}
        '200':
          description: 'Idempotent replay - same client_message_id, same message. Same body as 201.'
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {$ref: '#/components/schemas/PublicChatMessageVisitor'}
        '401': {description: AUTH_TOKEN_INVALID}
        '403': {description: 'PCHAT_SIGNED_IN - a signed-in member may read this conversation but must not write as the customer.'}
        '404': {description: PCHAT_ROOM_NOT_FOUND}
        '409': {description: PCHAT_ROOM_CLOSED}
        '410': {description: PCHAT_LINK_EXPIRED}
        '422': {description: 'VALIDATION_FAILED, or MSG_EMPTY / MSG_TOO_LONG / MSG_REPLY_INVALID / MSG_ATTACHMENT_INVALID.'}
        '429': {description: 'RATE_LIMITED. Named limiter pchat-visitor-write, 20/min keyed by code.'}
        '503': {description: PCHAT_DISABLED}
  /public-chat/{code}/uploads:
    post:
      summary: API-213 — Visitor upload ticket (uploader_id NULL, public_chat_room_id set)
      description: >
        kind 'avatar' is rejected 422 before UploadService is reached. Mime sniffing, the blocked
        extension list and the per-kind size caps are the existing ones, unchanged, plus the DEC-072
        refusal of browser-executable types including svg/xml.
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/pchatCode'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, filename, mime_type, size_bytes]
              properties:
                kind: {type: string, enum: [image, video, file]}
                filename: {type: string, maxLength: 255}
                mime_type: {type: string, maxLength: 255}
                size_bytes: {type: integer, minimum: 1}
                sha256: {type: [string, 'null'], minLength: 64, maxLength: 64}
      responses:
        '201':
          description: 'Top-level `attachment` (id and status ONLY) plus exactly one of `upload_url` / `multipart`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicChatUploadTicket'}
        '401': {description: AUTH_TOKEN_INVALID}
        '403': {description: PCHAT_SIGNED_IN}
        '404': {description: PCHAT_ROOM_NOT_FOUND}
        '409': {description: PCHAT_ROOM_CLOSED}
        '410': {description: PCHAT_LINK_EXPIRED}
        '422': {description: 'VALIDATION_FAILED including kind=avatar, MEDIA_TYPE_BLOCKED, MEDIA_MIME_MISMATCH, MEDIA_TOO_LARGE.'}
        '429': {description: 'RATE_LIMITED. Named limiter pchat-visitor-upload, 10/min keyed by code.'}
        '503': {description: PCHAT_DISABLED}
  /public-chat/{code}/uploads/{attachment_id}/complete:
    post:
      summary: API-214 — Complete a visitor upload (ownership is asserted against the room, not a user)
      description: >
        A visitor upload has uploader_id NULL by design, so "is this yours?" has no meaning - the
        public_chat_room_id partition column IS the ownership test. EVT-084 is emitted on the two room
        channels, never on a user channel.
      security: [{}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/pchatCode'}
        - {name: attachment_id, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                parts:
                  type: array
                  items: {type: object, required: [part_number, etag], properties: {part_number: {type: integer}, etag: {type: string}}}
      responses:
        '200':
          description: 'Top-level `attachment` with id and status ONLY - not the full attachment object, and not a `data` wrapper.'
          content:
            application/json:
              schema:
                type: object
                required: [attachment]
                properties:
                  attachment:
                    type: object
                    required: [id, status]
                    properties:
                      id: {type: string}
                      status: {type: string}
        '401': {description: AUTH_TOKEN_INVALID}
        '403': {description: PCHAT_SIGNED_IN}
        '404': {description: PCHAT_ROOM_NOT_FOUND}
        '409': {description: PCHAT_ROOM_CLOSED}
        '410': {description: PCHAT_LINK_EXPIRED}
        '422': {description: 'MSG_ATTACHMENT_INVALID when the attachment is not a row of THIS room, plus the usual media completion codes.'}
        '429': {description: 'RATE_LIMITED. Named limiter pchat-visitor-upload.'}
        '503': {description: PCHAT_DISABLED}
  /public-chat/{code}/broadcasting/auth:
    post:
      summary: API-215 — Visitor realtime authorisation for exactly one channel
      description: >
        Asserts channel_name === 'private-public-chat.' + room.id by LITERAL STRING EQUALITY - never a
        prefix, regex or str_contains match. There is exactly one legal value per code, and this
        assertion is the entire tenancy boundary on the realtime path - Reverb allows all origins and
        there is no CORS config, so neither is a backstop. The staff channel is not derivable from any
        visitor input and is rejected. Presence channels are never used; that would hand the visitor the
        agent roster. A read, so it answers while the feature is off and an open page keeps its socket
        across a disable/enable cycle.
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/pchatCode'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [socket_id, channel_name]
              properties:
                socket_id: {type: string, pattern: '^\d+\.\d+$', description: 'Validated with \A..\z anchors; a trailing newline does not slip past.'}
                channel_name: {type: string, description: 'Must equal private-public-chat.{room_id}. The room ULID, never the code, keys the channel.'}
      responses:
        '200':
          description: >
            The raw broadcaster response, top level - a single `auth` string. It is NOT wrapped in
            `data` and carries no user identity. Cache-Control is no-store.
          content:
            application/json:
              schema: {type: object, required: [auth], properties: {auth: {type: string}}}
        '401': {description: AUTH_TOKEN_INVALID}
        '404':
          description: >
            PCHAT_ROOM_NOT_FOUND - and this is what ANY other channel_name produces, including another
            room's channel and private-public-chat-staff.{own room id}. It is NOT a 403; a client must
            not branch on 403 here.
        '410': {description: PCHAT_LINK_EXPIRED}
        '422': {description: 'VALIDATION_FAILED with details.fields.socket_id when socket_id is not <digits>.<digits>.'}
        '429': {description: 'RATE_LIMITED. Named limiter pchat-visitor-read.'}
  /public-chat/{code}/typing:
    post:
      summary: API-216 — Visitor typing indicator (EVT-085 carries sender_kind only, never a username)
      description: >
        The request body is ignored entirely - there is no `typing` field, nothing is validated and
        nothing is required. Emits both the visitor and the staff typing frame.
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/pchatCode'}]
      responses:
        '202':
          description: 'Accepted. Body is `{"ok": true}` - a 202 with a body, NOT a 204 No Content.'
          content:
            application/json:
              schema: {type: object, required: [ok], properties: {ok: {type: boolean, const: true}}}
        '401': {description: AUTH_TOKEN_INVALID}
        '403': {description: PCHAT_SIGNED_IN}
        '404': {description: PCHAT_ROOM_NOT_FOUND}
        '409': {description: PCHAT_ROOM_CLOSED}
        '410': {description: PCHAT_LINK_EXPIRED}
        '429': {description: 'RATE_LIMITED. Named limiter pchat-visitor-write.'}
        '503': {description: PCHAT_DISABLED}
