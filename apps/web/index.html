<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- DEC-058: resizes-content keeps the composer above the Android on-screen keyboard.
         Pinch zoom must stay enabled — never add user-scalable=no / maximum-scale here. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <!-- FR-NOTI-003: an installable PWA is the only way a phone can receive a push
         with the tab closed. On iOS 16.4+ web push requires the site be added to
         the Home Screen, which needs this manifest and apple-touch-icon. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#863bff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Banana Chat" />
    <title>Banana Chat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
