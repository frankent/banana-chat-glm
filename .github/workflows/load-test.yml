name: load-test

# TASK-INF-012 — k6 load suite on a nightly schedule (NFR-PERF-001/002,
# FR-MSG-001 seq-race AC). Thresholds failing → red build.
# Manual run: workflow_dispatch (DURATION/VUS/RACE_VUS inputs).

on:
  schedule:
    - cron: '23 18 * * *' # 01:23 ICT nightly (avoid :00 spike)
  workflow_dispatch:
    inputs:
      duration:
        description: 'steady scenario duration (e.g. 2m)'
        default: '2m'
      vus:
        description: 'steady VUs'
        default: '8'
      race_vus:
        description: 'seq-race concurrent sends (FR-MSG-001 AC = 50)'
        default: '50'

jobs:
  k6:
    name: k6 — NFR-PERF thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orgchat
          POSTGRES_PASSWORD: orgchat
          POSTGRES_DB: orgchat
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U orgchat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: orgchat
      DB_USERNAME: orgchat
      DB_PASSWORD: orgchat
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: log
      FILESYSTEM_DISK: local
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, zip, gd
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate --force
      - name: Migrate + seed demo workspace
        run: |
          php artisan migrate --force
          php artisan db:seed --force
      - name: Serve API on :8000
        run: |
          # PHP built-in server is single-worker unless PHP_CLI_SERVER_WORKERS
          # is set — without it the k6 concurrency queues on one process.
          PHP_CLI_SERVER_WORKERS=16 php artisan serve --host=0.0.0.0 --port=8000 > serve.log 2>&1 &
          # /health reports 503 while degraded (no reverb in this job) — probe
          # login instead: it exercises DB+cache and returns 200 when serving.
          # `|| true`: curl exit 7 (port not bound yet — artisan serve is still
          # booting) propagates through the assignment under bash -e and killed
          # the step on the FIRST probe; that race failed every nightly since
          # the workflow existed.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api/v1/auth/login \
              -H 'Content-Type: application/json' -d '{"username":"tony","password":"Tony12345!"}' || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          # Exhausted loop used to "pass" (sleep's 0) and push the failure
          # into k6 with no serve.log context — fail here instead.
          if [ "$code" != "200" ]; then tail -100 serve.log; exit 1; fi
      - name: Run k6
        uses: grafana/setup-k6-action@v1
      - run: k6 run ../../infra/k6/chat-load.js
        env:
          TARGET: http://127.0.0.1:8000
          DURATION: ${{ github.event.inputs.duration || '2m' }}
          VUS: ${{ github.event.inputs.vus || '8' }}
          RACE_VUS: ${{ github.event.inputs.race_vus || '50' }}
      # Publish the verdict where it can be read WITHOUT repo-admin rights: job
      # logs and artifacts both need auth to download, and that is what made the
      # earlier nightly failures undiagnosable — exit 99 with no indication of
      # which of the five thresholds went. The step summary renders on the run
      # page itself. `always()`: a passing run's numbers are the baseline you
      # need to judge the next failure against.
      - name: Publish k6 verdict
        if: always()
        run: |
          if [ -f k6-verdict.md ]; then
            cat k6-verdict.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## k6 — no verdict written (k6 died before handleSummary)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: |
            apps/api/k6-summary.json
            apps/api/k6-verdict.md
          if-no-files-found: warn
      - name: Serve log on failure
        if: failure()
        run: tail -100 serve.log
